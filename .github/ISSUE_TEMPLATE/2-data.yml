name: Правка данных
description: Станция, адрес, коробка, мотоплощадка, офис. Версия — третий разряд (1.2.x).
title: "Данные: "
labels: ["данные"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что поправить
      description: Одна строка — одна правка. Станция, адрес, коробка.
      placeholder: "Строгино — АКПП, ул. Таллинская, 20к3\nТульская — только АКПП"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Откуда данные
      description: Выгрузка, сообщение, договорённость. Без ФИО и телефонов инструкторов.

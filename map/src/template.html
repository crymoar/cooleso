#marks .mk,#hl .mk{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
:root{
  --ink:#151717;--ink-2:#3b3f43;--muted:#6f757b;--line:#e7e7e2;--bg:#f5f5f1;--surface:#fff;
  --brand:#f5ce00;--brand-soft:#fff6c7;--ok:#1d7a4f;--ok-soft:#e6f4ec;--warn:#9a6200;--warn-soft:#fff3d6;
  --radius:14px;--shadow:0 6px 24px rgba(21,23,23,.10),0 1px 3px rgba(21,23,23,.08);
  --panel:400px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:500 15px/1.45 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2d6cdf;outline-offset:2px}

.app{display:grid;grid-template-columns:var(--panel) 1fr;height:100dvh}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line);z-index:2}
.map-wrap{position:relative;min-width:0}
#map{position:absolute;inset:0;background:#eef0ea}

/* header */
.head{padding:20px 20px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{margin:0;font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--bg);border-radius:12px;padding:9px 11px}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* controls */
.controls{padding:0 20px 12px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;padding:0 40px 0 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:15px;transition:border-color .15s}
.search input::placeholder{color:#9aa0a5;font-weight:500}
.search input:focus{outline:none;border-color:var(--ink)}
.search .clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--muted);display:none}
.search.has-value .clear{display:block}
.seg{display:flex;gap:4px;margin-top:10px;padding:4px;background:var(--bg);border-radius:12px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;transition:background .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button .n{font-weight:600;color:var(--muted);margin-left:4px;font-size:12px}
.flabel{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 2px 6px}
.controls .seg{margin-top:0}
.seg button:disabled{opacity:.35;cursor:default}
.seg-s button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg-s .ld{width:9px;height:9px;box-shadow:none}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:#151717}
.fnote{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--bg);font-size:12.5px;line-height:1.35;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{height:32px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .tick{display:none}
.chip[aria-pressed=true] .tick{display:inline}

/* list */
.list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 10px 16px}
.count{padding:8px 10px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;width:100%;text-align:left;padding:11px 10px;border:0;border-radius:12px;background:none}
.item:hover,.item.hover{background:var(--bg)}
.item.active{background:var(--brand-soft)}
.ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.ico.st{background:#fff;border:3.5px solid var(--c,#999);color:var(--ink)}
.ico.ad{background:var(--ink);color:var(--brand)}
.ico.ad svg{width:14px;height:14px}
.ico.mk{width:18px;height:18px;margin:5px;border-radius:50%;box-shadow:0 0 0 2.5px #fff,0 1px 3px rgba(0,0,0,.35)}
.ico.of{width:20px;height:20px;margin:4px;border-radius:5px;background:#151717;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ico.of i{width:7px;height:7px;border-radius:50%;background:#f5ce00}
.ico.ad{background:var(--bg);color:var(--ink-2)}
.item span.s{flex-wrap:nowrap;min-width:0;align-items:center;min-height:22px;line-height:22px}
.item .s .chips{align-items:center;margin-top:0}
.item .s .kp{line-height:22px}
.item .s .ln{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.item .s .ln>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s .flabel{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 2px 6px}
.controls .seg{margin-top:0}
.seg button:disabled{opacity:.35;cursor:default}
.seg-s button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg-s .ld{width:9px;height:9px;box-shadow:none}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:#151717}
.fnote{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--bg);font-size:12.5px;line-height:1.35;color:var(--muted);font-weight:600}
.chips{display:inline-flex;gap:4px;flex:none}
.item>span:last-child{min-width:0}
.kp.none{font-weight:700}
.item .t{font-weight:700;font-size:15px;line-height:1.3}
.item .s{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;font-size:13px;color:var(--muted);font-weight:600}
.dots{display:inline-flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--bg);color:var(--ink-2);font-size:11.5px;font-weight:700}
.tag.walk{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* detail */
.detail{display:none;flex:1;min-height:0;overflow:auto;padding:14px 20px 20px}
.panel.show-detail .detail{display:block}
.panel.show-detail .list{display:none}
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;margin-left:-6px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--ink-2)}
.back:hover{background:var(--bg)}
.detail h2{margin:10px 0 4px;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.detail .kind{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.line-badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;background:var(--bg);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.how{margin:16px 0;padding:12px 14px;border-radius:12px;background:var(--brand-soft);font-size:14px;font-weight:600}
.how b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#7a6500;margin-bottom:2px}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.near{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.near li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.near .nm{font-weight:700;display:flex;align-items:center;gap:7px}

.near button:hover .nm{text-decoration:underline}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

.btn:hover{filter:brightness(.97)}

.warnbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}

/* map overlays */
.mapbar{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:3}

.views button[aria-selected=true]{background:var(--ink);color:#fff}
.is-scheme .mapbar,.is-scheme .maplibregl-ctrl-top-right{display:none}
.is-map .views{right:62px}
#scheme{position:absolute;inset:0;background:#fff}
#scheme.leaflet-container{background:#fff;font-family:inherit}
#scheme.drag{cursor:grabbing}

.sc-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
#scheme svg text{font-family:"Inter Tight",Arial,Helvetica,sans-serif!important;font-weight:500}
#scheme .lb{cursor:pointer}
#hits .hit{fill:transparent;cursor:pointer}
#objects,#labels,#marks{transition:opacity .55s cubic-bezier(.4,0,.2,1)}
#hl{opacity:0;pointer-events:none;transition:opacity .55s cubic-bezier(.4,0,.2,1)}
.hl #objects,.hl #labels,.hl #marks{opacity:.16}
.hl #hl{opacity:1}

#scheme .lb.meet text{font-weight:700}
.glow{fill:var(--brand);opacity:.45;transition:opacity .3s}
.glow.on{opacity:.95}

.hit{fill:transparent;cursor:pointer}
#veil{fill:#fff;opacity:0;transition:opacity .35s ease;pointer-events:none}
#veil.on{opacity:.78}
.pin{pointer-events:none;transition:opacity .25s}
.pin.hide{opacity:0}
.kp{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:800;letter-spacing:.01em}
.kp::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.kp.mt{background:#fdf0d6;color:#9a5d00}.kp.at{background:#dcecfa;color:#1a6fb0}.kp.none{background:#eeefec;color:#62676c}
.sc-card .kpp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sc-card .kp{height:26px;font-size:13px}
.sc-card{position:absolute;z-index:6;transition:opacity .3s ease .1s,transform .3s ease .1s!important;width:min(280px,calc(100% - 24px));padding:12px 14px 13px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.sc-card.on{opacity:1;transform:none;pointer-events:auto}
.sc-card .from{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}

.item .trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:24px}
.item.one{align-items:center}
.item .trow .chips{display:inline-flex;gap:4px;margin:0}
.ico.ln{width:16px;height:16px;margin:6px 7px;border-radius:50%;flex:none}
.ico.of{width:18px;height:18px;margin:5px 6px;border-radius:5px;background:#151717;display:grid;place-items:center;flex:none}
.ico.of i{width:6px;height:6px;border-radius:50%;background:#f5ce00}
.ico.mo{width:22px;height:22px;margin:3px 4px;border-radius:50%;background:#e5484d;color:#fff;font:800 11px/22px "Inter Tight",Arial;text-align:center;flex:none}
.tag.mo{background:#fde7e7;color:#b4262b}
.brand-cluster.sc-cl{border-color:var(--rc)}
.brand-pin.moto .brand-pin-type{background:#e5484d;font-size:7.5px}
.sc-card{transition:opacity .35s cubic-bezier(.22,.61,.36,1),transform .35s cubic-bezier(.22,.61,.36,1)!important}
.hl-on .leaflet-marks-pane,.hl-on .leaflet-marker-pane{transition:opacity .45s cubic-bezier(.4,0,.2,1)}
#hltop,#scheme svg #labels{transition:opacity .45s cubic-bezier(.4,0,.2,1)!important}
.leaflet-hits-pane path{cursor:pointer}
@media (max-width:820px){
  .map-wrap{position:sticky;top:0;height:46dvh;min-height:300px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .panel{margin-top:0;border-radius:0;box-shadow:none}
  .panel.show-detail .head,.panel.show-detail .controls,.panel.show-detail .foot,.panel.show-detail #fnote{display:none}
  .detail .back{position:sticky;top:max(46dvh,300px);z-index:5;background:var(--surface);width:calc(100% + 32px);margin:0 -16px;padding:10px 16px;border-radius:0;border-bottom:1px solid var(--line);height:auto}
  .sc-card{display:none!important}
}
.adr-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8a4fe0;border:2px solid #fff;box-shadow:0 0 0 1px #c9cdd1;vertical-align:-1px}
.leaflet-tooltip.adr-tip{font:600 12px/1.2 'Inter Tight',system-ui,sans-serif;padding:3px 7px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}

<body>

    <div class="mapbar"><button class="pill-btn" id="toggle-lines" aria-pressed="false">

    <div class="legend" aria-hidden="true"><span class="lg-sc"><i class="ld" style="background:#f29900"></i>МКПП</span><span class="lg-sc"><i class="ld" style="background:#1f6fe5"></i>АКПП</span><span class="lg-sc"><i class="ld" style="background:#8a4fe0"></i>МКПП и АКПП</span><span class="lg-sc"><i class="ld" style="background:#e5484d"></i>мото</span><span class="lg-sc"><i class="ld" style="background:#151717"></i>офис</span><span class="lg-only-map brand-legend"><i class="lg-logo"></i>Локации «Колесо»</span><span class="lg-only-map" style="color:var(--muted)">М метро · Ц МЦК · Д МЦД · О офис · Мт мото · <i class="adr-dot"></i> адрес занятий</span></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js" defer></script>
<script>
const METRO_URL=window.KOLESO_METRO_URL||'data/metro.json';
/* ---------- places data: CSV (main, human-editable) or JSON ----------
   data/places.csv is used when present, otherwise data/places.json.
   An embedding page may point to its own file: window.KOLESO_PLACES_URL='https://…/places.csv' (or .json).
   CSV columns (header names are case-insensitive, any order):
     тип        метро | адрес | точка | офис | мото (зал) | мото (улица)
     название   station name (метро) or address text (адрес)
     линия      line, only to pick one of stations with the same name
     мкпп, акпп да / нет
     встреча    да / нет — нет: station is shown only as the nearest one to an address
     широта, долгота  for адрес/точка
     станции    stations near an address: "Тульская 5 мин 392 м, Шаболовская (МЦК) 9 мин"
     станция    for офис/мото: the station it belongs to
     сезон      for мото: лето | зима | круглый год
     примечание office address; for адрес a note shown only in ?admin=1 */
const PLACES_URLS=window.KOLESO_PLACES_URL?[window.KOLESO_PLACES_URL]:['data/places.csv','data/places.json'];
const loadJSON=async u=>{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw Error(u+': '+r.status);return r.json()};
async function loadPlaces(metro){
  for(const u of PLACES_URLS){
    let r;try{r=await fetch(u,{cache:'no-cache'})}catch(e){continue}
    if(!r.ok)continue;
    const text=await r.text();
    if(/\.json(\?|#|$)/i.test(u)||/^\s*\{/.test(text))return JSON.parse(text);
    return csvToPlaces(text,metro,r.headers.get('last-modified'));
  }
  throw Error('нет файла с местами: '+PLACES_URLS.join(', '));
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0],delim=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;continue}
    if(c==='"')q=true;else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);
  const head=rows.shift().map(h=>h.trim().toLowerCase().replaceAll('ё','е').replace(/[\s_]+/g,' '));
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}
function csvToPlaces(text,metro,modified){
  const nm=s=>String(s||'').toLowerCase().replaceAll('ё','е').replace(/[\s\-—–.«»"]/g,'');
  const yes=v=>/^(да|д|yes|y|\+|1|x|х|true)$/i.test(String(v).trim());
  const num=v=>{const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:null};
  const lineOf={};metro.lines.forEach(l=>l.st.forEach(id=>(lineOf[id]=lineOf[id]||[]).push(l)));
  const byName={};for(const[id,s]of Object.entries(metro.allst))(byName[nm(s.n)]=byName[nm(s.n)]||[]).push(id);
  const KIND_RANK={'Метро':0,'МЦК':1,'МЦД':2};
  /* station by name, optional line; without a line: metro first, then МЦК, МЦД */
  const findStation=(name,line)=>{
    let ids=byName[nm(name)]||[];
    if(line){const L=nm(line);ids=ids.filter(id=>(lineOf[id]||[]).some(l=>nm(l.n)===L||nm(l.n).startsWith(L)||nm(l.n).replace('линия','')===L))}
    return ids.sort((a,b)=>(KIND_RANK[(lineOf[a]||[{}])[0].k]??3)-(KIND_RANK[(lineOf[b]||[{}])[0].k]??3))[0]||null};
  /* lines of the whole interchange: same name, same kind (метро / МЦК / МЦД), within ~1 km */
  const hubLines=id=>{const s=metro.allst[id],kind=(lineOf[id]||[{}])[0].k,out=[];
    for(const j of byName[nm(s.n)]||[]){const o=metro.allst[j];if(Math.hypot((o.lat-s.lat)*111,(o.lon-s.lon)*63)>1)continue;
      for(const l of lineOf[j]||[])if(l.k===kind&&!out.includes(l.n))out.push(l.n)}return out};
  const stRec=(id,m,kpp)=>{const s=metro.allst[id],L=lineOf[id]||[];return{id,n:s.n,lat:s.lat,lon:s.lon,k:(L[0]||{}).k||'Метро',l:hubLines(id),m,kpp}};
  const out={date:'',stations:[],points:[],svc:[],issues:[],warnings:[]};
  const seen={};const warn=(i,msg)=>out.warnings.push(`строка ${i+2}: ${msg}`);
  const rows=parseCSV(text);
  rows.forEach((r,i)=>{
    const type=nm(r['тип']||r['type']);
    if(!type)return;
    if(type==='метро'||type==='станция'||type==='мцк'||type==='мцд'){
      const id=findStation(r['название'],r['линия']);if(!id)return warn(i,`станция «${r['название']}» не найдена`);
      const kpp=[];if(yes(r['мкпп']))kpp.push('mt');if(yes(r['акпп']))kpp.push('at');
      const meet=r['встреча']===undefined||r['встреча']===''||yes(r['встреча']);
      if(seen[id]){Object.assign(seen[id],{m:Math.max(seen[id].m,meet?1:0)});kpp.forEach(k=>seen[id].kpp.includes(k)||seen[id].kpp.push(k));return}
      out.stations.push(seen[id]=stRec(id,meet?1:0,kpp));return;
    }
    if(type==='адрес'||type==='точка'){
      const lat=num(r['широта']),lon=num(r['долгота']);if(lat===null||lon===null)return warn(i,`у «${r['название']}» нет координат`);
      const nb=[];
      for(const part of String(r['станции']||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean)){
        const m=part.match(/^(.+?)(?:\s*\(([^)]+)\))?\s+(\d+)\s*мин\.?(?:\s+(\d+)\s*м\.?)?$/i);
        if(!m){warn(i,`не понял станцию «${part}»`);continue}
        const id=findStation(m[1],m[2]);if(!id){warn(i,`станция «${m[1]}» не найдена`);continue}
        nb.push({s:id,t:+m[3],d:m[4]?+m[4]:Math.round(+m[3]*83)});
      }
      /* no station within walking distance: attach to the nearest one in a straight line (≈1.25 × distance, 5 km/h) */
      if(!nb.length){let best=null,bd=1e12;const cl=Math.cos(lat*Math.PI/180);
        for(const[id,s]of Object.entries(metro.allst)){if(!lineOf[id])continue;const d=Math.hypot((s.lat-lat)*111320,(s.lon-lon)*111320*cl);if(d<bd){bd=d;best=id}}
        if(best){const d=Math.round(bd*1.25);nb.push({s:best,t:Math.round(d/83),d,far:d>2500});warn(i,`у «${r['название']}» нет станций в пешей доступности — привязан к ближайшей, ${metro.allst[best].n} (${(d/1000).toFixed(1)} км)`)}}
      nb.sort((a,b)=>a.t-b.t);
      const kpp=[];if(yes(r['мкпп']))kpp.push('mt');if(yes(r['акпп']))kpp.push('at');
      if(!kpp.length)warn(i,`у «${r['название']}» не указана коробка`);
      out.points.push({id:'a'+(out.points.length+1),n:r['название'],pin:type==='точка'?1:0,lat,lon,nb,kpp,c:r['примечание']||''});
      for(const n of nb)if(!seen[n.s])out.stations.push(seen[n.s]=stRec(n.s,0,[]));
      return;
    }
    if(type==='офис'||type.startsWith('мото')){
      const id=findStation(r['станция']||r['название'],r['линия']);if(!id)return warn(i,`станция «${r['станция']||r['название']}» не найдена`);
      const s=metro.allst[id],season=nm(r['сезон']);
      const k=type==='офис'?'office':/лет|лето/.test(season)?'moto_summer':/зим/.test(season)?'moto_winter':/круг|год/.test(season)?'moto_allyear'
        :/зал|помещ/.test(type)?'moto_indoor':'moto_outdoor';
      const lat=num(r['широта']),lon=num(r['долгота']);
      out.svc.push({id:'svc'+(out.svc.length+1),k,n:s.n,sid:id,note:type==='офис'?'Офис автошколы «Колесо»\n'+(r['примечание']||''):(r['примечание']||''),
        lat:lat??s.lat,lon:lon??s.lon});
      return;
    }
    warn(i,`неизвестный тип «${r['тип']}»`);
  });
  /* a station without its own gearbox (walking distance from an address) takes the gearbox of those addresses */
  for(const s of out.stations)if(!s.kpp.length){
    for(const p of out.points)if(p.nb.some(n=>n.s===s.id))p.kpp.forEach(k=>s.kpp.includes(k)||s.kpp.push(k));
    s.kpp.sort((a,b)=>a==='mt'?-1:1);
    if(!s.kpp.length)out.warnings.push(`станция «${s.n}»: не указана коробка и нет адреса рядом с коробкой`);
  }
  const d=modified?new Date(modified):new Date();out.date=d.toLocaleDateString('ru-RU');
  if(out.warnings.length)console.warn('places.csv:',out.warnings);
  return out;
}

addEventListener('DOMContentLoaded',async()=>{
let D;
try{const me=await loadJSON(METRO_URL);const pl=await loadPlaces(me);D={...me,...pl}}
catch(e){console.error(e);document.getElementById('list').innerHTML='<div class="empty"><b>Не удалось загрузить места занятий</b>Обновите страницу. Если не помогло — данные временно недоступны.</div>';return}
const ADMIN=new URLSearchParams(location.search).has('admin');
/* hover only for a real mouse: the pointer type of the last event decides (a tap must not trigger hover) */
let lastPointer='mouse';['pointerdown','pointermove'].forEach(ev=>addEventListener(ev,e=>{lastPointer=e.pointerType},true));
const CAN_HOVER=true;const isMouse=()=>lastPointer==='mouse';
if(ADMIN&&D.warnings&&D.warnings.length){const w=document.createElement('div');w.className='warnbox';w.style.margin='8px 20px';w.textContent='Данные: '+D.warnings.length+' замечаний — '+D.warnings.join('; ');document.querySelector('.controls').after(w)}
const LOGO='<circle cx="32" cy="32" r="32" fill="#151717"/><circle cx="32" cy="32" r="20.5" fill="none" stroke="#f5ce00" stroke-width="5.6"/><path d="M28.6 23.5v17c0 2 2.5 3 3.9 1.6l8.4-8.4c.9-.9.9-2.4 0-3.3l-8.4-8.5c-1.4-1.4-3.9-.4-3.9 1.6z" fill="#fff"/>';
document.getElementById('logo').innerHTML=LOGO;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s).toLowerCase().replaceAll('ё','е');
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const LINE={};D.lines.forEach(l=>LINE[l.n]=l);
const lineColor=n=>(LINE[n]||{}).c||'#8a8f94';
const KIND={'Метро':'метро','МЦК':'МЦК','МЦД':'МЦД'};
const short=n=>n.replace('Большая кольцевая линия','БКЛ').replace('Таганско-Краснопресненская','Таганско-Краснопр.');

/* stations that are meeting points, + every station referenced by an address */
const ST={};D.stations.forEach(s=>ST[s.id]=s);
const stationInfo=id=>(ST[id]&&ST[id].lon>36.5&&ST[id].lon!==ST[id].lat?ST[id]:null)||(D.allst[id]&&{id,...D.allst[id],n:D.allst[id].n,l:D.lines.filter(l=>l.st.includes(id)).map(l=>l.n),k:(D.lines.find(l=>l.st.includes(id))||{}).k||'Метро'});
/* addresses within walking distance of each station */
/* "Таллинская улица, 20, корпус 3" -> "ул. Таллинская, 20к3" */
const ADDR_ABBR={'проспект':'пр-т','бульвар':'б-р','шоссе':'ш.','проезд':'пр.','переулок':'пер.','площадь':'пл.','набережная':'наб.'};
const shortAddr=a=>String(a).split(/,\s*/).map(s=>{const ul=/(^|\s)улица(\s|$)/i;if(ul.test(s))return ('ул. '+s.replace(ul,' ').trim()).replace(/\s+/g,' ');
    for(const[w,ab]of Object.entries(ADDR_ABBR))s=s.replace(new RegExp('(^|\\s)'+w+'(?=\\s|$)','i'),'$1'+ab);return s})
  .join(', ').replace(/, корпус\s*/g,'к').replace(/, строение\s*/g,'с');
const AD_BY_ST={};D.points.forEach(p=>p.nb.forEach(n=>(AD_BY_ST[n.s]=AD_BY_ST[n.s]||[]).push({p,t:n.t,d:n.d,far:n.far})));
const km=d=>(d/1000).toFixed(1).replace('.',',')+' км';
const walkTxt=a=>a.far?km(a.d):a.t+' мин пешком';

const PLACES=[
  ...D.stations.filter(s=>s.kpp&&s.kpp.length).map(s=>({id:s.id,type:'st',name:s.n,lat:s.lat,lon:s.lon,kind:s.k,lines:s.l,kpp:s.kpp,raw:s})),
  ...D.svc.filter(s=>s.sid).map(s=>{const st=D.allst[s.sid]||{};const L=D.lines.filter(l=>l.st.includes(s.sid)).map(l=>l.n);
    return{id:s.id,type:s.k==='office'?'of':'mo',sub:s.k,name:s.k==='office'?'Офис «Колесо» · '+s.n:'Мотоплощадка · '+s.n,addr:s.k==='office'?(s.note||'').split('\n').slice(1).join(' '):(s.note||''),station:s.n,sid:s.sid,lat:s.lat,lon:s.lon,kind:s.k==='office'?'Офис':'Мото',lines:L,kpp:[],note:s.note,raw:s}})
];
PLACES.forEach(p=>{
  p.ads=p.type==='st'?(AD_BY_ST[p.id]||[]).slice().sort((a,b)=>a.t-b.t):[];
  p.metro=p.type==='st'&&p.raw.m!==0;
  p.search=fold([p.name,...p.lines,p.kind,...p.ads.map(a=>a.p.n+' '+shortAddr(a.p.n))].join(' '));
});
const BY_ID=Object.fromEntries(PLACES.map(p=>[p.id,p]));
const MOTO_SEASON={moto_summer:'Летняя площадка',moto_winter:'Зимняя площадка',moto_allyear:'Круглый год',moto_indoor:'В помещении',moto_outdoor:'На улице'};
const motoText=p=>MOTO_SEASON[p.sub]||'Мотоплощадка';

/* ---------- state ---------- */
const state={q:'',type:'all',kpp:'any',mcd:true,sel:null,lines:false};

/* filters: where (type), gearbox ('mt' also matches stations with both), МЦД/МЦК, search */
function matches(p,skip){
  const q=fold(state.q.trim());
  if(skip!=='type'&&state.type==='metro'&&!p.metro)return false;
  if(skip!=='type'&&state.type==='addr'&&!(p.ads&&p.ads.length))return false;
  if(!state.mcd&&(p.type==='st')&&p.kind!=='Метро')return false;
  if(state.kpp==='moto'){if(p.type!=='mo')return false}
  else if(state.kpp!=='any'&&!(p.type==='st'&&p.kpp.includes(state.kpp)))return false;
  if(q&&!p.search.includes(q))return false;
  return true;
}
function visible(){return PLACES.filter(p=>matches(p)).sort((a,b)=>(a.type==='mo'?a.station:a.name).localeCompare(b.type==='mo'?b.station:b.name,'ru'))}
function updateCounts(){
  const base=PLACES.filter(p=>matches(p,'type'));
  const n={all:base.length,metro:base.filter(p=>p.metro).length,addr:base.filter(p=>p.ads&&p.ads.length).length};
  for(const k in n)$('#n-'+k).textContent=n[k];
  $$('.seg [data-type]').forEach(b=>b.disabled=b.dataset.type!=='all'&&!n[b.dataset.type]);
  const note=$('#fnote');
  if(state.kpp==='mt'||state.kpp==='at'){note.hidden=false;note.textContent='Показаны станции, где есть '+(state.kpp==='mt'?'механика':'автомат')+'.'}
  else if(state.kpp==='moto'){note.hidden=false;note.textContent='Показаны мотоплощадки: летние, зимние и круглогодичные.'}
  else note.hidden=true;
}

/* ---------- list ---------- */
const HOUSE='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11 12 4l8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg>';
/* same mark as on the scheme: colour = gearbox */
/* station: circle in the line colour (split for interchanges); gearbox shown as chips next to the name */
const RINGC={mt:'#f29900',at:'#1f6fe5',both:'#8a4fe0',none:'#9aa0a6',office:'#151717',moto:'#e5484d'};
function icon(p){
  if(p.type==='ad')return `<span class="ico ad" title="Встреча по адресу">${HOUSE}</span>`;
  if(p.type==='of')return '<span class="ico of" title="Офис"><i></i></span>';
  if(p.type==='mo')return `<span class="ico mo" title="Мотоплощадка">М</span>`;
  const cs=[...new Set(p.lines.map(lineColor))].slice(0,4);
  const bg=cs.length<2?cs[0]||'#9aa0a6':`conic-gradient(${cs.map((c,i)=>`${c} ${i*100/cs.length}% ${(i+1)*100/cs.length}%`).join(',')})`;
  return `<span class="ico ln" style="background:${bg}" title="${esc(p.lines.join(', '))}"></span>`;
}
const dots=lines=>`<span class="dots">${lines.map(l=>`<i class="dot" style="--c:${lineColor(l)}" title="${esc(l)}"></i>`).join('')}</span>`;
const SVC={mt:'#e7a329',at:'#228cda',office:'#247958',moto:'#168c91',none:'#4b4f54'};
const svcOf=p=>p.type==='of'?'office':p.type==='mo'?'moto':p.kpp.length===2?'both':p.kpp[0]||'none';
const kppTags=(p,long)=>p.type!=='st'?'':p.kpp.map(k=>`<span class="kp ${k}">${k==='mt'?(long?'МКПП · механика':'МКПП'):(long?'АКПП · автомат':'АКПП')}</span>`).join('');
function sub(p){
  if(p.type==='st'){const a=p.ads[0];if(!a)return '';
    return `<span>${HOUSE}${esc(shortAddr(a.p.n))}</span><span class="tag walk">${walkTxt(a)}</span>${p.ads.length>1?`<span>+ ещё ${p.ads.length-1}</span>`:''}${ADMIN&&p.ads.some(x=>x.p.c)?'<span class="tag warn">уточнить</span>':''}`}
  if(p.type==='of')return `<span>${dots(p.lines)} м. ${esc(p.station)}${p.addr?' · '+esc(p.addr):''}</span>`;
  if(p.type==='mo')return p.addr?`<span>${HOUSE}${esc(p.addr)}</span>`:'';
  const n=p.near;let s=n?`<span class="tag walk">${n.t} мин пешком</span><span>${dots(n.st.l||[])} м. ${esc(n.st.n)}</span>`:'<span>Рядом нет станций в расчёте</span>';
  if(ADMIN&&p.raw.c)s+='<span class="tag warn">уточнить</span>';
  return s;
}
function renderList(){
  updateCounts();
  const v=visible();
  const nst=v.filter(p=>p.type==='st').length,nad=v.length-nst;
  $('#list').innerHTML=v.length
    ?`<div class="count">${plural(v.length,'место','места','мест')}${state.q?' по запросу':''}</div>`+v.map(p=>{const s=sub(p);return `<button class="item${state.sel===p.id?' active':''}${s?'':' one'}" role="listitem" data-id="${p.id}">${icon(p)}<span class="body"><span class="trow"><span class="t">${esc(p.type==='mo'?p.station:p.name)}</span>${p.type==='st'?`<span class="chips">${kppTags(p)}</span>`:p.type==='mo'?`<span class="chips"><span class="tag mo">${motoText(p)}</span></span>`:''}</span>${s?`<span class="s">${s}</span>`:''}</span></button>`}).join('')
    :`<div class="empty"><b>Ничего не нашли</b>Попробуйте название станции или улицы${state.kpp!=='any'?', или снимите фильтр по коробке':''}.</div>`;
  $$('#list .item').forEach(b=>{
    b.onclick=()=>select(b.dataset.id,true);
    b.onmouseenter=()=>hover(b.dataset.id);b.onmouseleave=()=>hover(null);
  });
  updateMap(v);
}

/* ---------- detail ---------- */
const ymPoint=p=>`https://yandex.ru/maps/?pt=${p.lon},${p.lat}&z=17&l=map`;
const ymRoute=(a,b)=>`https://yandex.ru/maps/?rtext=${a?a.lat+','+a.lon:''}~${b.lat},${b.lon}&rtt=${a?'pd':'mt'}`;
function nearRow(name,lines,t,d,href,id,extra=''){
  return `<li><button data-go="${id}"><div class="nm">${lines?dots(lines):''}${esc(name)}</div>${extra?`<div class="kpp">${extra}</div>`:''}<div class="mt">${d?d+' м · ':''}<a href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">маршрут</a></div></button><div class="time">${typeof t==='string'?t:`${t}<small> мин</small>`}</div></li>`;
}
function renderDetail(p){
  let h=`<button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Все места</button>`;

    const st={lat:p.lat,lon:p.lon};
    h+=`<h2>${esc(p.name)}</h2><div class="kind">${p.lines.map(l=>`<span class="line-badge">${dots([l])}${esc(l)}</span>`).join('')}</div>
      <div class="how"><b>${p.type==='of'?'Офис автошколы':'Мотоплощадка · '+motoText(p).toLowerCase()}</b>${esc(p.addr||'')}${p.addr?'<br>':''}м. ${esc(p.station)}</div>`;
    h+=`<div class="actions"><a class="btn primary" href="${ymRoute(null,st)}" target="_blank" rel="noopener">Как добраться</a><a class="btn" href="${ymPoint(st)}" target="_blank" rel="noopener">Яндекс Карты</a></div>`;
  }else if(p.type==='st'){
    const ads=p.ads,where=p.kind==='МЦД'?'МЦД':p.kind==='МЦК'?'МЦК':'метро';
    h+=`<h2>${esc(p.name)}</h2><div class="kind">${p.lines.map(l=>`<span class="line-badge">${dots([l])}${esc(l)}</span>`).join('')}${kppTags(p)}</div>
      <div class="how"><b>Место встречи</b>${p.metro?`Инструктор встречает у станции ${where}. Точный выход согласуйте при записи.`:''}${p.metro&&ads.length?'<br>':''}${ads.length?(ads.length>1?'Занятия по адресам рядом со станцией — список ниже.':`Занятия по адресу ${esc(shortAddr(ads[0].p.n))}, ${walkTxt(ads[0])}.`):''}</div>`;
    if(ads.length)h+=`<div class="sec"><h3>${ads.length>1?'Адреса':'Адрес'} рядом${ads.every(a=>!a.far)?', пешком':''}</h3><ul class="near">${ads.map(a=>nearRow(shortAddr(a.p.n),null,a.far?km(a.d):a.t,a.far?0:a.d,ymRoute(p,a.p),'',kppTags({type:'st',kpp:a.p.kpp||[]})+(ADMIN&&a.p.c?`<div class="warnbox">${esc(a.p.c)}</div>`:''))).join('')}</ul></div>`;
    h+=`<div class="actions"><a class="btn primary" href="${ymRoute(null,p)}" target="_blank" rel="noopener">Как добраться</a><a class="btn" href="${ymPoint(p)}" target="_blank" rel="noopener">Яндекс Карты</a></div>`;
  }else{
    const r=p.raw;
    h+=`<h2>${esc(p.name)}</h2><div class="kind"><span class="line-badge">${p.raw.pin?'Точка на карте':'Адрес'}</span>${kppTags(p)}</div>
      <div class="how"><b>Место встречи</b>Инструктор ждёт по этому адресу. Ориентир у дома уточните при записи.</div>`;
    h+=`<div class="sec"><h3>Ближайшие станции, пешком</h3>${r.nb.length?`<ul class="near">${r.nb.map(n=>{const s=stationInfo(n.s);return s?nearRow(s.n,s.l,n.t,n.d,ymRoute(s,p),ST[n.s]?.m?n.s:''):''}).join('')}</ul>`:'<p class="note">Станций в пешей доступности не найдено.</p>'}</div>`;
    if(ADMIN&&r.c)h+=`<div class="warnbox">${esc(r.c)}</div>`;
    h+=`<div class="actions"><a class="btn primary" href="${ymRoute(null,p)}" target="_blank" rel="noopener">Как добраться</a><a class="btn" href="${ymPoint(p)}" target="_blank" rel="noopener">Яндекс Карты</a></div>`;
  }
  h+=`<p class="note">Время пешком — расчёт по пешеходной сети OpenStreetMap при 5 км/ч, до центра станции. Реальное время зависит от выхода и светофоров.</p>`;
  $('#detail').innerHTML=h;
  $('#back').onclick=()=>select(null);
  $$('#detail [data-go]').forEach(b=>{if(b.dataset.go)b.onclick=()=>select(b.dataset.go,true)});
}

const MOBILE=()=>innerWidth<=820;
let listScroll=0;
function select(id,fly){
  const was=state.sel;state.sel=id;
  const p=id&&BY_ID[id];
  if(MOBILE()&&p&&!was)listScroll=scrollY;
  $('#panel').classList.toggle('show-detail',!!p);
  if(p){renderDetail(p);$('#detail').scrollTop=0;if(MOBILE())scrollTo({top:0,behavior:'smooth'})}
  else if(MOBILE()&&was)requestAnimationFrame(()=>scrollTo({top:listScroll}));
  $$('#list .item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  highlight(p,fly);schemeSelect(p,fly);
}

const RING={mt:'#f29900',at:'#1f6fe5',both:'#8a4fe0',none:'#9aa0a6',office:'#151717',moto:'#e5484d'};
const walkOf=p=>!!(AD_BY_ST[p.sid||p.id]||[]).length;
/* ring grows with zoom so a place is always clearly bigger than a plain station dot */
/* never smaller than 10px on screen; when zoomed in, grows with the scheme so it stays bigger than station nodes (r≈8 scheme units) */
/* white rim is a fixed share of the disc (≈40% of radius), so it reads as part of the mark, not as the scheme's own station outline */
const ringSize=()=>{const k=Math.pow(2,sm?sm.getZoom():0),r=Math.max(14,15*k);return{r,w:r*.3}};
const ringStyle=p=>{const sv=p.cat||svcOf(p),big=sv==='office'||sv==='moto',s=ringSize();
  return{pane:'marks',radius:s.r+(big?1:0),color:'#fff',weight:s.w,fillColor:RING[sv],fillOpacity:1}};
/* one cluster logic for both maps */
const clusterOpts=()=>({maxClusterRadius:45,showCoverageOnHover:false,spiderfyOnMaxZoom:true,
  iconCreateFunction:c=>L.divIcon({className:'brand-cluster-wrap',html:`<div class="brand-cluster" aria-label="Мест рядом: ${c.getChildCount()}">${c.getChildCount()}</div>`,iconSize:[44,44]})});
/* scheme clusters: ring colour by what is inside — only МКПП, only АКПП, or both */
const groupCat=cats=>{const mt=cats.some(c=>c==='mt'||c==='both'),at=cats.some(c=>c==='at'||c==='both');
  return mt&&at?'both':mt?'mt':at?'at':cats.every(c=>c==='moto')?'moto':cats.every(c=>c==='office')?'office':'none'};
const schemeClusterOpts=()=>({...clusterOpts(),iconCreateFunction:c=>{const cat=groupCat(c.getAllChildMarkers().flatMap(m=>m.options.cats||[]));
  return L.divIcon({className:'brand-cluster-wrap',html:`<div class="brand-cluster sc-cl" style="--rc:${RING[cat]}" aria-label="Мест рядом: ${c.getChildCount()}">${c.getChildCount()}</div>`,iconSize:[44,44]})}});
let firstFit=true;
/* centre on a marker and zoom until it leaves its cluster; at max zoom fan the cluster out */
function reveal(map,cluster,m,minZoom,done){
  if(!cluster.hasLayer(m))return;
  const step=()=>{
    if(!cluster.hasLayer(m))return;
    const par=cluster.getVisibleParent(m);
    if(!par||par===m){done&&done();return}
    if(map.getZoom()>=map.getMaxZoom()){par.spiderfy&&par.spiderfy();done&&done();return}
    map.once('moveend',step);map.setView(m.getLatLng(),Math.min(map.getZoom()+1,map.getMaxZoom()),{animate:true});
  };
  map.once('moveend',step);map.setView(m.getLatLng(),Math.max(map.getZoom(),minZoom),{animate:true});
}

/* ----- city map ----- */
let cityMap=null,cityCluster,cityLines,cityLinks,cityMarkers={};
function cityPin(p){
  const label=p.type==='ad'?'•':p.type==='of'?'О':p.type==='mo'?'Мт':p.kind==='Метро'?'М':p.kind==='МЦК'?'Ц':'Д';
  const cls=p.type==='ad'?'address':p.type==='of'?'office':p.type==='mo'?'moto':p.kind==='МЦД'?'train':'station';
  return L.divIcon({className:'brand-pin-wrap',html:`<div class="brand-pin ${cls}"><svg viewBox="0 0 44 54" width="44" height="54" aria-hidden="true"><path d="M22 52C18 47 3 31 3 21a19 19 0 1 1 38 0c0 10-15 26-19 31Z" fill="#151717" stroke="#fff" stroke-width="2.5"/><image href="${PIN_LOGO}" x="8" y="6" width="28" height="28"/></svg><span class="brand-pin-type">${label}</span></div>`,
    iconSize:[44,54],iconAnchor:[22,52],popupAnchor:[0,-46],tooltipAnchor:[18,-30]});
}
function initCity(){
  if(cityMap)return;
  if(typeof L==='undefined'){document.body.classList.add('no-map');return}
  cityMap=L.map('map',{maxZoom:19,minZoom:8,zoomControl:false}).setView([55.75,37.62],10);
  cityMap.attributionControl.setPrefix(false);              /* no Leaflet flag */
  L.control.zoom({position:'bottomright'}).addTo(cityMap);
  const attr='<a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
  try{
    if(!L.maplibreGL)throw Error('no maplibre');
    const gl=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/positron',interactive:false,attribution:attr}).addTo(cityMap);
    const m=gl.getMaplibreMap();
    m.on('load',()=>{for(const l of m.getStyle().layers){
      if(l.type==='symbol'&&/poi|housenumber/.test(l.id))m.setLayoutProperty(l.id,'visibility','none');
      if(l.type==='symbol'&&JSON.stringify(l.layout?.['text-field']||'').includes('name'))m.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ru'],['get','name']]);
    }});
    m.on('error',e=>console.warn(e.error));
  }catch(e){L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(cityMap)}
  cityLines=L.layerGroup(D.lines.map(l=>L.polyline(l.g.map(seg=>seg.map(([lon,lat])=>[lat,lon])),{color:l.c,weight:3,opacity:.75,dashArray:l.k==='Метро'?null:'6 5',interactive:false})));
  if(state.lines)cityLines.addTo(cityMap);
  cityLinks=L.layerGroup().addTo(cityMap);
  cityCluster=L.markerClusterGroup(clusterOpts()).addTo(cityMap);
  cityMap.on('click',()=>{if(state.sel)select(null)});
  updateCity(visible());
}
function updateCity(v){
  if(!cityMap)return;
  cityCluster.clearLayers();cityMarkers={};
  const ms=v.map(p=>{const m=L.marker([p.lat,p.lon],{icon:cityPin(p),title:p.name,keyboard:false});
    m.bindTooltip(esc(p.name),{direction:'top'});
    m.on('click',()=>select(p.id,cityMap.getZoom()<15));m.on('mouseover',()=>{if(isMouse())hoverList(p.id)});m.on('mouseout',()=>{if(isMouse())hoverList(null)});
    cityMarkers[p.id]=m;return m});
  if(ms.length&&(state.q||firstFit)){cityMap.fitBounds(L.latLngBounds(v.map(p=>[p.lat,p.lon])),{padding:[30,30],maxZoom:15,animate:false});firstFit=false}
  cityCluster.addLayers(ms.splice(0,ms.length>40?ms.length:0));ms.forEach(m=>cityCluster.addLayer(m));
}
function highlightCity(p,fly){
  if(!cityMap)return;
  cityLinks.clearLayers();if(!p)return;
  const others=p.type==='st'?p.ads.map(a=>a.p):[];
  others.forEach(o=>{L.polyline([[p.lat,p.lon],[o.lat,o.lon]],{color:'#151717',weight:2,opacity:.7,dashArray:'2 6',interactive:false}).addTo(cityLinks);
    if(p.type==='st')L.circleMarker([o.lat,o.lon],{radius:6,color:'#fff',weight:2.5,fillColor:RING[svcOf({type:'st',kpp:o.kpp||[]})],fillOpacity:1,interactive:false}).bindTooltip(esc(shortAddr(o.n)),{permanent:true,direction:'right',offset:[10,0],className:'adr-tip'}).addTo(cityLinks)});
  if(fly){const m=cityMarkers[p.id];if(m)reveal(cityMap,cityCluster,m,15,()=>m.openTooltip())}
}
function hover(id){ /* list -> map */
  if(view==='scheme'&&sc.ready&&!sc.pinned)setTarget(id&&SM_MARK[id]?id:null);
  if(view==='map'&&cityMap){Object.values(cityMarkers).forEach(m=>m.closeTooltip());const m=id&&cityMarkers[id];if(m&&cityMap.hasLayer(m))m.openTooltip()}
}
function hoverList(id){ /* map -> list */
  $$('#list .item.hover').forEach(b=>b.classList.remove('hover'));
  if(id){const b=$(`#list .item[data-id="${CSS.escape(id)}"]`);if(b){b.classList.add('hover');b.scrollIntoView({block:'nearest'})}}
}

/* ----- metro scheme: Yandex Metro scheme as a flat Leaflet map (CRS.Simple) ----- */
const SC=D.scheme, SCHEME_URL=window.KOLESO_SCHEME_URL||'metro-scheme.svg';
const NS='http://www.w3.org/2000/svg',W0=SC.vb[2],H0=SC.vb[3];
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const fold2=s=>fold(s).replace(/[\s\-.«»"—]/g,'');
const toLL=(x,y)=>[H0-y,x];
const stOf=p=>{const id=p.sid||p.id;return SC.st.find(s=>s.id===id)||null};
let sc={ready:false,loading:false,target:null,pinned:null},sm=null,smCluster=null,SM_MARK={};
async function loadScheme(){
  if(sc.ready||sc.loading)return;
  if(typeof L==='undefined'){document.body.classList.add('no-map');return}
  sc.loading=true;
  let txt;
  try{const r=await fetch(SCHEME_URL);if(!r.ok)throw Error(r.status);txt=await r.text()}
  catch(e){console.warn(e);sc.loading=false;const m=document.createElement('div');m.className='sc-msg';m.textContent='Схема метро не загрузилась. Обновите страницу.';$('#scheme').append(m);return}
  const svg=document.importNode(new DOMParser().parseFromString(txt,'image/svg+xml').documentElement,true);
  svg.setAttribute('viewBox',`0 0 ${W0} ${H0}`);
  sm=L.map('scheme',{crs:L.CRS.Simple,minZoom:-2.5,maxZoom:1.5,zoomSnap:.25,zoomDelta:.5,wheelPxPerZoomLevel:90,attributionControl:false,zoomControl:false,
    maxBounds:[[-H0*.25,-W0*.25],[H0*1.25,W0*1.25]]});
  sm.createPane('marks').style.zIndex=450;sm.createPane('marktop').style.zIndex=460;sc.top=L.layerGroup().addTo(sm);
  sm.createPane('hits').style.zIndex=480;sc.hits=L.layerGroup().addTo(sm);
  /* station names go to their own layer above the place marks */
  sm.createPane('labels').style.zIndex=470;sm.getPane('labels').style.pointerEvents='none';
  const svgTop=svg.cloneNode(false);const st0=svg.querySelector('style');if(st0)svgTop.appendChild(st0.cloneNode(true));
  svgTop.appendChild(svg.querySelector('#labels'));sc.gHlTop=el('g',{id:'hltop'},svgTop);
  L.svgOverlay(svg,[[0,0],[H0,W0]],{interactive:false}).addTo(sm);
  L.svgOverlay(svgTop,[[0,0],[H0,W0]],{interactive:false,pane:'labels'}).addTo(sm);
  /* labels tied to stations (bold for places), shapes indexed by line colour for the highlight */
  sc.labels=[...svgTop.querySelectorAll('#labels .scheme-objects-view__label')].map(g=>{
    const tt=[...g.querySelectorAll('text')];if(!tt.length)return null;
    const name=fold2(tt[tt.length-1].textContent);const b=tt[0];
    const lx=+(b.getAttribute('x')||0),ly=+(b.getAttribute('y')||0);
    let best=null,bd=1e9;for(const s of SC.st){if(fold2(s.n)!==name)continue;const d=Math.hypot(s.x-lx,s.y-ly);if(d<bd){bd=d;best=s}}
    g.classList.add('lb');return{el:g,id:best?best.id:null,c:new Set(best?best.c:[])};
  }).filter(Boolean);
  const objs=svg.querySelector('#objects');
  sc.shapes=[...objs.querySelectorAll(':scope > g > line, :scope > g > path, :scope > g > g, :scope > line, :scope > path, :scope > g.scheme-objects-view__station, :scope > g.scheme-objects-view__transfers > *')]
    .filter(e=>!e.closest('.scheme-objects-view__decorations'));
  sc.shapes.forEach(e=>{const cs=new Set();[e,...e.querySelectorAll('*')].forEach(n=>{for(const a of ['stroke','fill']){const v=(n.getAttribute(a)||'').toLowerCase();if(/^#[0-9a-f]{6}$/.test(v))cs.add(v)}});e._c=cs});
  sc.svg=svg;sc.gHl=el('g',{id:'hl'},svg);
  /* label boxes (for hover areas) and line membership of every scheme shape */
  /* label box = union of its text boxes only (the group also holds hidden helpers) */
  sc.labels.forEach(l=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const tx of l.el.querySelectorAll('text')){let b;try{b=tx.getBBox()}catch(e){continue}if(!b.width)continue;
      x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)}
    if(x1>x0)l.bb={x:x0,y:y0,width:x1-x0,height:y1-y0}});
  indexLines();
  smCluster=L.markerClusterGroup(schemeClusterOpts()).addTo(sm);
  sm.on('click',()=>{sc.pinned=null;if(state.sel)select(null);else setTarget(null,true)});
  sm.on('move zoom',placeCard);
  sm.on('zoomend',()=>{for(const g of Object.values(sc.byStation||{})){const st=ringStyle({cat:g.mark.options.cat});g.mark.setStyle({weight:st.weight});g.mark.setRadius(st.radius)}sc.top.eachLayer(l=>{const st=ringStyle({cat:(SM_MARK[sc.target]||{options:{}}).options.cat||'none'});l.setStyle({weight:st.weight+1});l.setRadius(st.radius+1.5)})});
  $$('#sc-zoom button').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(!z)return fitScheme(true);z>1?sm.zoomIn():sm.zoomOut()});
  sc.ready=true;sc.loading=false;
  startView();updateScheme(visible());
  if(state.sel)schemeSelect(BY_ID[state.sel],true);
}
/* each line of the metro reference gets: its colour on the scheme (most common among its stations)
   and its station points; a scheme shape belongs to the same-coloured line whose stations are nearest */
function indexLines(){
  const lineOfSt={};D.lines.forEach(l=>l.st.forEach(id=>(lineOfSt[id]=lineOfSt[id]||[]).push(l.id)));
  sc.lineOfSt=lineOfSt;
  const info={};
  for(const l of D.lines){const pts=[],col={};
    for(const id of l.st){const st=SC.st.find(s=>s.id===id);if(!st)continue;pts.push([st.x,st.y]);
      if(st.c.length===1)col[st.c[0]]=(col[st.c[0]]||0)+3;else st.c.forEach(c=>col[c]=(col[c]||0)+1)}
    const c=Object.entries(col).sort((a,b)=>b[1]-a[1])[0];if(c&&pts.length)info[l.id]={c:c[0],pts}}
  sc.lineInfo=info;
  const near=(x,y,pts)=>{let d=1e9;for(const[a,b]of pts){const v=Math.hypot(a-x,b-y);if(v<d)d=v}return d};
  for(const e of sc.shapes){
    let bb;try{bb=e.getBBox()}catch(_){continue}
    const pts=[[bb.x,bb.y],[bb.x+bb.width,bb.y+bb.height],[bb.x+bb.width/2,bb.y+bb.height/2]];
    e._l=new Set();
    for(const c of e._c){
      const cands=Object.entries(info).filter(([,v])=>v.c===c);if(!cands.length)continue;
      if(cands.length===1){e._l.add(cands[0][0]);continue}
      let best=null,bd=1e9;for(const[id,v]of cands){const d=Math.min(...pts.map(([x,y])=>near(x,y,v.pts)));if(d<bd){bd=d;best=id}}
      if(best)e._l.add(best)}
  }
  sc.labels.forEach(l=>{l.l=new Set(l.id?(lineOfSt[l.id]||[]):[])});
}
function startView(){const w=$('#scheme').clientWidth||1000;sm.setView(toLL(1520,1560),Math.log2(w/1500),{animate:false})}
function fitScheme(anim){sm.fitBounds([[0,0],[H0,W0]],{padding:[12,12],animate:!!anim})}
function updateScheme(v){
  if(!sc.ready)return;
  smCluster.clearLayers();SM_MARK={};sc.byStation={};sc.hits.clearLayers();
  /* one mark per station, whatever number of places is there */
  for(const p of v){if(p.type==='ad')continue;const s=stOf(p);if(!s)continue;(sc.byStation[s.id]=sc.byStation[s.id]||{s,places:[]}).places.push(p)}
  const ms=[];
  for(const[sid,g]of Object.entries(sc.byStation)){
    const cats=g.places.map(svcOf),lesson=cats.filter(c=>c!=='office'&&c!=='moto');
    const cat=lesson.length?groupCat(lesson):cats.includes('moto')?'moto':'office';
    const main=g.places.find(p=>p.type==='st')||g.places[0];g.main=main.id;
    const m=L.circleMarker(toLL(g.s.x,g.s.y),{...ringStyle({cat}),cats});m.options.cat=cat;g.mark=m;
    if(CAN_HOVER){m.on('mouseover',()=>hoverOn(sid));m.on('mouseout',()=>hoverOff())}
    m.on('click',e=>{L.DomEvent.stopPropagation(e);select(main.id,sm.getZoom()<-.5)});
    for(const p of g.places)SM_MARK[p.id]=m;ms.push(m);
    /* hover/click area: the station point plus its label, with a small margin (#3) */
    const lb=sc.labels.find(l=>l.id===sid);let x0=g.s.x-22,y0=g.s.y-22,x1=g.s.x+22,y1=g.s.y+22;
    const near=lb&&lb.bb&&Math.hypot(lb.bb.x+lb.bb.width/2-g.s.x,lb.bb.y+lb.bb.height/2-g.s.y)<160&&lb.bb.width<420&&lb.bb.height<90;
    if(near){x0=Math.min(x0,lb.bb.x-8);y0=Math.min(y0,lb.bb.y-8);x1=Math.max(x1,lb.bb.x+lb.bb.width+8);y1=Math.max(y1,lb.bb.y+lb.bb.height+8)}
    const hit=L.rectangle([toLL(x0,y1),toLL(x1,y0)],{pane:'hits',stroke:false,fill:true,fillOpacity:0,interactive:true});
    hit._mark=m;
    if(CAN_HOVER){hit.on('mouseover',()=>{if(!!m._map)hoverOn(sid)});hit.on('mouseout',()=>hoverOff())}
    hit.on('click',e=>{if(!m._map)return;L.DomEvent.stopPropagation(e);select(main.id,sm.getZoom()<-.5)});
    hit.addTo(sc.hits);
  }
  if(state.q&&ms.length)sm.fitBounds(L.latLngBounds(ms.map(m=>m.getLatLng())),{padding:[70,70],maxZoom:-.5,animate:false});if(sm.getZoom()<-1.25)sm.setZoom(-1.25,{animate:false});
  smCluster.addLayers(ms.splice(0,ms.length>40?ms.length:0));ms.forEach(m=>smCluster.addLayer(m)); /* addLayers drops small sets */
  sc.labels.forEach(l=>l.el.classList.toggle('meet',!!l.id&&!!sc.byStation[l.id]));
  if(sc.target&&!SM_MARK[sc.target])setTarget(null,true);
}
const hoverOn=sid=>{if(!isMouse())return;clearTimeout(leaveT);if(!sc.pinned)setTarget(sc.byStation[sid].main)};
const hoverOff=()=>{if(!isMouse())return;clearTimeout(leaveT);if(!sc.pinned)leaveT=setTimeout(()=>setTarget(null),220)};

/* hover a place: after a short delay its line lights up, the rest fades, then the card appears */
const HOVER_DELAY=160;let hoverT=null,leaveT=null,hlKey='',hlClear=0;
function cardOff(){$('#sc-card').classList.remove('on')}
function lightLines(lines){
  const svg=sc.svg;clearTimeout(hlClear);
  if(!lines||!lines.size){svg.classList.remove('hl');$('#scheme').classList.remove('hl-on');hlKey='';hlClear=setTimeout(()=>{if(!hlKey){sc.gHl.replaceChildren();sc.gHlTop.replaceChildren()}},700);return}
  const key=[...lines].sort().join();
  if(key!==hlKey){hlKey=key;const has=s=>{for(const c of s)if(lines.has(c))return true;return false};
    const frag=document.createDocumentFragment();
    sc.shapes.forEach(e=>{if(e._l&&has(e._l))frag.appendChild(e.cloneNode(true))});
    const fl=document.createDocumentFragment();sc.labels.forEach(l=>{if(has(l.l))fl.appendChild(l.el.cloneNode(true))});
    sc.gHl.replaceChildren(frag);sc.gHlTop.replaceChildren(fl)}
  svg.classList.add('hl');$('#scheme').classList.add('hl-on');
}
function setTarget(id,now){
  clearTimeout(hoverT);
  if(!id){sc.target=null;cardOff();if(sc.svg)lightLines(null);sc.top&&sc.top.clearLayers();hoverList(null);return}
  if(id===sc.target)return;
  const go=()=>{const p=BY_ID[id],s=stOf(p);sc.target=id;sc.top.clearLayers();const cat=(SM_MARK[id]||{options:{}}).options.cat||svcOf(p);if(s)L.circleMarker(toLL(s.x,s.y),{...ringStyle({cat}),pane:'marktop',interactive:false,radius:ringStyle({cat}).radius+1.5,weight:ringStyle({cat}).weight+1}).addTo(sc.top);
    lightLines(new Set(s?(sc.lineOfSt[s.id]||[]):[]));renderCard();hoverList(id)};
  if(now)go();else hoverT=setTimeout(go,HOVER_DELAY);
}
function renderCard(){
  const box=$('#sc-card'),id=sc.target;if(!id||view!=='scheme'||MOBILE()){cardOff();return}
  const p=BY_ID[id],s=stOf(p),g=s&&sc.byStation&&sc.byStation[s.id],others=g?g.places.filter(x=>x!==p):[];
  const ads=(AD_BY_ST[p.sid||id]||[]).sort((a,b)=>a.t-b.t);
  const line=x=>x.type==='of'?`<div class="r ok">Офис автошколы${x.addr?' · '+esc(x.addr):''}</div>`
    :x.type==='mo'?`<div class="r ok">Мотоплощадка · ${motoText(x).toLowerCase()}${x.addr?' · '+esc(x.addr):''}</div>`
    :`${x.kpp.length?`<div class="kpp">${kppTags(x,true)}</div>`:''}<div class="r ok">${x.metro?'Инструктор встречает у станции':'Занятия по адресу рядом со станцией'}</div>`;
  box.innerHTML=`<b>${esc(p.type==='st'?p.name:p.station)}</b><div class="r">${p.lines.map(l=>`${dots([l])}${esc(short(l))}`).join(' · ')}</div>`+
    line(p)+others.map(line).join('')+
    (ads.length?`<div class="r">${ads.slice(0,2).map(a=>esc(shortAddr(a.p.n))+' · '+walkTxt(a)).join('<br>')}${ads.length>2?'<br>+ ещё '+(ads.length-2):''}</div>`:'')+
    `<div class="more"><button type="button" data-open="${id}">Подробнее</button></div>`;
  box.querySelector('[data-open]').onclick=()=>select(id,false);
  placeCard();requestAnimationFrame(()=>box.classList.add('on'));
}
function placeCard(){
  const box=$('#sc-card');if(!sc.target||!sm)return;
  const s=stOf(BY_ID[sc.target]);if(!s)return;
  const pt=sm.latLngToContainerPoint(toLL(s.x,s.y)),r=$('#scheme').getBoundingClientRect();
  const w=box.offsetWidth,h=box.offsetHeight;
  const gap=ringSize().r+12;
  const TOP=60,RIGHT=r.width<600?64:12;let left=Math.min(Math.max(pt.x-30,12),r.width-w-RIGHT),top=pt.y+gap,below=false;
  if(top+h>r.height-12&&pt.y-h-gap>=TOP){top=pt.y-h-gap;below=true}
  if(top+h>r.height-12)top=Math.max(TOP,r.height-h-12);
  box.classList.toggle('below',below);box.style.left=left+'px';box.style.top=top+'px';box.style.setProperty('--ax',Math.min(Math.max(pt.x-left-6,14),w-26)+'px');
}
function schemeSelect(p,fly){
  if(!sc.ready)return;
  if(!p){sc.pinned=null;setTarget(null,true);return}
  if(p.type==='ad'){ /* address: centre on its nearest station */
    const n=p.raw.nb[0],s=n&&SC.st.find(x=>x.id===n.s);sc.pinned=null;setTarget(null,true);
    if(fly&&s)sm.setView(toLL(s.x,s.y),Math.max(sm.getZoom(),-.5),{animate:true});
    if(n&&SM_MARK[n.s]){sc.pinned=n.s;setTarget(n.s,true)}return}
  const id=p.id;if(!SM_MARK[id])return;
  sc.pinned=id;setTarget(id,true);
  if(fly)reveal(sm,smCluster,SM_MARK[id],-.5,placeCard);
}
function highlight(p,fly){highlightCity(p,fly)}

/* ---------- view switching ---------- */
let view='scheme';
function setView(v){
  view=v;$('#app').classList.toggle('is-scheme',v==='scheme');$('#app').classList.toggle('is-map',v==='map');
  $('#v-scheme').setAttribute('aria-selected',v==='scheme');$('#v-map').setAttribute('aria-selected',v==='map');
  $('#scheme').hidden=v!=='scheme';$('#sc-zoom').hidden=v!=='scheme';$('#map').style.visibility=v==='map'?'visible':'hidden';
  if(v!=='scheme')cardOff();
  if(v==='scheme'){if(sm){sm.invalidateSize();if(sc.target)renderCard()}else loadScheme()}
  if(v==='map'){if(cityMap){cityMap.invalidateSize();highlightCity(state.sel&&BY_ID[state.sel],true)}else initCity()}
}
$('#v-scheme').onclick=()=>setView('scheme');$('#v-map').onclick=()=>setView('map');

/* ---------- controls ---------- */
const nst=PLACES.filter(p=>p.metro).length,nad=PLACES.filter(p=>p.ads&&p.ads.length).length;

$('#stats').innerHTML=`<div class="stat"><b>${PLACES.length}</b><span>мест встречи</span></div><div class="stat"><b>${nst}</b><span>у метро и МЦД</span></div><div class="stat"><b>${nad}</b><span>по адресу</span></div>`;
const APP_VERSION=(document.querySelector('meta[name=app-version]')||{}).content||'dev';
$('#foot').textContent=`Версия ${APP_VERSION} · данные от ${D.date}. Карта © OpenStreetMap, OpenFreeMap.`;
let t;$('#q').oninput=e=>{state.q=e.target.value;$('#searchbox').classList.toggle('has-value',!!state.q);clearTimeout(t);t=setTimeout(()=>{if(state.sel)select(null);renderList()},120)};
$('#clear').onclick=()=>{$('#q').value='';$('#q').dispatchEvent(new Event('input'));$('#q').focus()};
$$('.seg [data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;$$('.seg [data-type]').forEach(x=>x.setAttribute('aria-pressed',x===b));select(null);renderList()});
$$('[data-kpp]').forEach(b=>b.onclick=()=>{state.kpp=b.dataset.kpp;$$('[data-kpp]').forEach(x=>x.setAttribute('aria-pressed',x===b));if(state.kpp==='moto'&&state.type!=='all'){state.type='all';$$('.seg [data-type]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.type==='all'))}select(null);renderList()});
$('#mcd').onchange=e=>{state.mcd=e.target.checked;select(null);renderList()};
$('#toggle-lines').onclick=e=>{state.lines=!state.lines;e.currentTarget.setAttribute('aria-pressed',state.lines);if(cityMap){state.lines?cityLines.addTo(cityMap):cityLines.remove()}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sel)select(null)});

renderList();
setView(new URLSearchParams(location.search).get('view')==='map'?'map':'scheme');
});

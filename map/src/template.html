<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Где проходят занятия — автошкола «Колесо»</title>
<meta name="description" content="Места встречи с инструктором в Москве и области: у метро и по адресу. Поиск, фильтры, время пешком от станции.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --ink:#151717;--ink-2:#3b3f43;--muted:#6f757b;--line:#e7e7e2;--bg:#f5f5f1;--surface:#fff;
  --brand:#f5ce00;--brand-soft:#fff6c7;--ok:#1d7a4f;--ok-soft:#e6f4ec;--warn:#9a6200;--warn-soft:#fff3d6;
  --radius:14px;--shadow:0 6px 24px rgba(21,23,23,.10),0 1px 3px rgba(21,23,23,.08);
  --panel:400px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:500 15px/1.45 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2d6cdf;outline-offset:2px}

.app{display:grid;grid-template-columns:var(--panel) 1fr;height:100dvh}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line);z-index:2}
.map-wrap{position:relative;min-width:0}
#map{position:absolute;inset:0;background:#eef0ea}

/* header */
.head{padding:20px 20px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{margin:0;font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--bg);border-radius:12px;padding:9px 11px}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* controls */
.controls{padding:0 20px 12px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;padding:0 40px 0 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:15px;transition:border-color .15s}
.search input::placeholder{color:#9aa0a5;font-weight:500}
.search input:focus{outline:none;border-color:var(--ink)}
.search .clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--muted);display:none}
.search.has-value .clear{display:block}
.seg{display:flex;gap:4px;margin-top:10px;padding:4px;background:var(--bg);border-radius:12px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;transition:background .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button .n{font-weight:600;color:var(--muted);margin-left:4px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{height:32px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .tick{display:none}
.chip[aria-pressed=true] .tick{display:inline}

/* list */
.list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 10px 16px}
.count{padding:8px 10px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;width:100%;text-align:left;padding:11px 10px;border:0;border-radius:12px;background:none}
.item:hover,.item.hover{background:var(--bg)}
.item.active{background:var(--brand-soft)}
.ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.ico.st{background:#fff;border:3.5px solid var(--c,#999);color:var(--ink)}
.ico.ad{background:var(--ink);color:var(--brand)}
.ico.ad svg{width:14px;height:14px}
.item .t{font-weight:700;font-size:15px;line-height:1.3}
.item .s{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;font-size:13px;color:var(--muted);font-weight:600}
.dots{display:inline-flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--bg);color:var(--ink-2);font-size:11.5px;font-weight:700}
.tag.walk{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* detail */
.detail{display:none;flex:1;min-height:0;overflow:auto;padding:14px 20px 20px}
.panel.show-detail .detail{display:block}
.panel.show-detail .list{display:none}
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;margin-left:-6px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--ink-2)}
.back:hover{background:var(--bg)}
.detail h2{margin:10px 0 4px;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.detail .kind{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.line-badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;background:var(--bg);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.how{margin:16px 0;padding:12px 14px;border-radius:12px;background:var(--brand-soft);font-size:14px;font-weight:600}
.how b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#7a6500;margin-bottom:2px}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.near{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.near li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.near .nm{font-weight:700;display:flex;align-items:center;gap:7px}
.near .mt{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.near .time{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.near .time small{font-weight:600;color:var(--muted);font-size:12px}
.near button{all:unset;cursor:pointer}
.near button:hover .nm{text-decoration:underline}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand)}
.btn:hover{filter:brightness(.97)}
.note{margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:500}
.warnbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}

/* map overlays */
.mapbar{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:3}
.pill-btn{height:38px;padding:0 14px;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.pill-btn[aria-pressed=true]{background:var(--ink);color:#fff}
.views{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.views button{height:34px;padding:0 14px;border:0;border-radius:9px;background:none;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.views button[aria-selected=true]{background:var(--ink);color:#fff}
.is-scheme .mapbar,.is-scheme .maplibregl-ctrl-top-right{display:none}
.is-map .views{right:62px}
#scheme{position:absolute;inset:0;background:#fff;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#scheme.drag{cursor:grabbing}
#scheme svg{display:block;width:100%;height:100%}
.sc-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
#scheme svg text{font-family:"YS Text",Inter,Arial,Helvetica,sans-serif}
#scheme .lb{cursor:pointer}
#scheme .lb.meet text{font-weight:700}
.glow{fill:var(--brand);opacity:.45;transition:opacity .3s}
.glow.on{opacity:.95}

.hit{fill:transparent;cursor:pointer}
#veil{fill:#fff;opacity:0;transition:opacity .15s ease;pointer-events:none}
#veil.on{opacity:.78}
.pin{pointer-events:none;transition:opacity .25s}
.pin.hide{opacity:0}
.sc-card{position:absolute;z-index:6;width:min(280px,calc(100% - 24px));padding:12px 14px 13px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.sc-card.on{opacity:1;transform:none;pointer-events:auto}
.sc-card .from{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.sc-card b{display:block;font-size:16px;font-weight:800;line-height:1.2}
.sc-card .r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--ink-2);margin-top:5px}
.sc-card .ok{color:var(--ok)}
.sc-card .more{margin-top:10px;display:flex;gap:6px}
.sc-card .more button{height:32px;padding:0 12px;border:0;border-radius:9px;background:var(--brand);font-weight:800;font-size:13px}
.sc-card::after{content:"";position:absolute;left:var(--ax,20px);top:-6px;width:12px;height:12px;background:#fff;transform:rotate(45deg);border-radius:2px;box-shadow:-2px -2px 3px rgba(0,0,0,.04)}
.sc-card.below::after{top:auto;bottom:-6px}
@media (prefers-reduced-motion:reduce){#veil,.sc-card,.glow,.lb{transition:none}}
.sc-zoom{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;border-radius:12px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.sc-zoom button{width:40px;height:40px;border:0;background:none;font-size:20px;font-weight:600}
.sc-zoom button+button{border-top:1px solid var(--line)}
.is-map .lg-sc{display:none}.is-scheme .lg-mp{display:none}
.legend{position:absolute;left:14px;bottom:14px;z-index:3;display:flex;gap:14px;align-items:center;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-st{width:14px;height:14px;border-radius:50%;border:3.5px solid #e42313;background:#fff}
.lg-ad{width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2.5px var(--brand) inset}
.lg-cl{width:16px;height:16px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.maplibregl-ctrl-group{border-radius:12px!important;box-shadow:var(--shadow)!important}
.maplibregl-ctrl-group button{width:38px!important;height:38px!important}
.maplibregl-popup-content{font:700 13px/1.3 "Inter Tight",system-ui,sans-serif;padding:7px 11px;border-radius:10px;box-shadow:var(--shadow)}
.maplibregl-popup-tip{display:none}
.maplibregl-ctrl-attrib{font-size:10.5px}
.fallback{display:none;position:absolute;inset:0;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:4;background:var(--bg)}
.no-map .is-map .fallback{display:grid}
.foot{padding:10px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:500}

@media (max-width:820px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
  .map-wrap{order:-1;height:58dvh;min-height:340px;flex:none}
  .panel{border-right:0;border-radius:18px 18px 0 0;margin-top:-18px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .head{padding:18px 16px 12px}
  .controls{padding:0 16px 12px}
  .list,.detail{overflow:visible}
  .detail{padding:12px 16px 24px}
  .legend{display:none}
  .views{top:10px;right:10px}
  .is-map .views{right:56px}
  .mapbar{top:10px;left:10px}
  .stats b{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app is-scheme" id="app">
  <aside class="panel" id="panel" aria-label="Места занятий">
    <div class="head">
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true" id="logo"></svg>
        <h1>Где проходят занятия<small>Автошкола «Колесо» · Москва и область</small></h1>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="controls">
      <div class="search" id="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Станция, улица или линия" autocomplete="off" aria-label="Поиск по станции, адресу или линии">
        <button class="clear" id="clear" aria-label="Очистить поиск">✕</button>
      </div>
      <div class="seg" role="group" aria-label="Тип места">
        <button data-type="all" aria-pressed="true">Все</button>
        <button data-type="st" aria-pressed="false">У метро<span class="n" id="n-st"></span></button>
        <button data-type="ad" aria-pressed="false">По адресу<span class="n" id="n-ad"></span></button>
      </div>
      <div class="chips" role="group" aria-label="Фильтры">
        <button class="chip" data-kpp="mt" aria-pressed="false"><span class="tick">✓</span>Механика</button>
        <button class="chip" data-kpp="at" aria-pressed="false"><span class="tick">✓</span>Автомат</button>
        <button class="chip" id="mcd" aria-pressed="true"><span class="tick">✓</span>МЦД и МЦК</button>
      </div>
    </div>
    <div class="list" id="list" role="list"></div>
    <div class="detail" id="detail" aria-live="polite"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <section class="map-wrap" aria-label="Карта">
    <div id="map"></div>
    <div id="scheme" hidden><div class="sc-card" id="sc-card"></div></div>
    <div class="sc-zoom" id="sc-zoom" hidden><button data-z="1.5" aria-label="Приблизить">+</button><button data-z="0.667" aria-label="Отдалить">−</button><button data-z="0" aria-label="Показать всю схему">⤢</button></div>
    <div class="views" role="tablist" aria-label="Вид"><button role="tab" id="v-scheme" aria-selected="true">Схема метро</button><button role="tab" id="v-map" aria-selected="false">Карта города</button></div>
    <div class="mapbar"><button class="pill-btn" id="toggle-lines" aria-pressed="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 17c4-8 8 2 12-6 1.5-3 3.5-4 6-4"/></svg>Линии метро</button></div>
    <div class="legend" aria-hidden="true"><span class="lg-mp"><i class="lg-st"></i>Встреча у метро</span><span class="lg-mp"><i class="lg-ad"></i>Встреча по адресу</span><span class="lg-mp"><i class="lg-cl"></i>Несколько мест</span><span class="lg-sc"><b style="font-weight:800">Жирным</b> — здесь встречает инструктор</span><span class="lg-sc" style="color:var(--muted)">Наведите на станцию — покажем ближайшее место занятий</span></div>
    <div class="fallback">Карта не загрузилась (нет интернета или WebGL). Список мест слева работает.</div>
  </section>
</div>

<script id="data" type="application/json">__DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script>
addEventListener('DOMContentLoaded',()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const ADMIN=new URLSearchParams(location.search).has('admin');
const LOGO='<circle cx="32" cy="32" r="32" fill="#151717"/><circle cx="32" cy="32" r="20.5" fill="none" stroke="#f5ce00" stroke-width="5.6"/><path d="M28.6 23.5v17c0 2 2.5 3 3.9 1.6l8.4-8.4c.9-.9.9-2.4 0-3.3l-8.4-8.5c-1.4-1.4-3.9-.4-3.9 1.6z" fill="#fff"/>';
document.getElementById('logo').innerHTML=LOGO;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s).toLowerCase().replaceAll('ё','е');
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const LINE={};D.lines.forEach(l=>LINE[l.n]=l);
const lineColor=n=>(LINE[n]||{}).c||'#8a8f94';
const KIND={'Метро':'метро','МЦК':'МЦК','МЦД':'МЦД'};
const short=n=>n.replace('Большая кольцевая линия','БКЛ').replace('Таганско-Краснопресненская','Таганско-Краснопр.');

/* stations that are meeting points, + every station referenced by an address */
const ST={};D.stations.forEach(s=>ST[s.id]=s);
const stationInfo=id=>(ST[id]&&ST[id].lon>36.5&&ST[id].lon!==ST[id].lat?ST[id]:null)||(D.allst[id]&&{id,...D.allst[id],n:D.allst[id].n,l:D.lines.filter(l=>l.st.includes(id)).map(l=>l.n),k:(D.lines.find(l=>l.st.includes(id))||{}).k||'Метро'});
/* addresses within walking distance of each station */
const AD_BY_ST={};D.points.forEach(p=>p.nb.forEach(n=>(AD_BY_ST[n.s]=AD_BY_ST[n.s]||[]).push({p,t:n.t,d:n.d})));

const PLACES=[
  ...D.stations.filter(s=>s.m).map(s=>({id:s.id,type:'st',name:s.n,lat:s.lat,lon:s.lon,kind:s.k,lines:s.l,kpp:s.kpp,raw:s})),
  ...D.points.map(p=>({id:p.id,type:'ad',name:p.n,lat:p.lat,lon:p.lon,kind:'Адрес',lines:[],kpp:[],raw:p}))
];
PLACES.forEach(p=>{
  if(p.type==='ad'){const n=p.raw.nb[0];p.near=n?{...n,st:stationInfo(n.s)}:null}
  p.search=fold([p.name,...p.lines,p.kind,p.near?.st?.n||'',...(p.raw.nb||[]).map(n=>stationInfo(n.s)?.n||'')].join(' '));
});
const BY_ID=Object.fromEntries(PLACES.map(p=>[p.id,p]));

/* ---------- state ---------- */
const state={q:'',type:'all',kpp:new Set(),mcd:true,sel:null,lines:true};

function visible(){
  const q=fold(state.q.trim());
  return PLACES.filter(p=>{
    if(state.type!=='all'&&p.type!==state.type)return false;
    if(!state.mcd&&p.type==='st'&&p.kind!=='Метро')return false;
    if(state.kpp.size&&(p.type!=='st'||![...state.kpp].every(k=>p.kpp.includes(k))))return false;
    if(q&&!p.search.includes(q))return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

/* ---------- list ---------- */
function icon(p){
  if(p.type==='ad')return `<span class="ico ad"><svg viewBox="0 0 64 64">${LOGO}</svg></span>`;
  return `<span class="ico st" style="--c:${lineColor(p.lines[0])}">${p.kind==='МЦД'?'Д':p.kind==='МЦК'?'Ц':'М'}</span>`;
}
const dots=lines=>`<span class="dots">${lines.map(l=>`<i class="dot" style="--c:${lineColor(l)}" title="${esc(l)}"></i>`).join('')}</span>`;
const kppTags=p=>p.kpp.map(k=>`<span class="tag">${k==='mt'?'МКПП':'АКПП'}</span>`).join('');
function sub(p){
  if(p.type==='st')return `${dots(p.lines)}<span>${esc(p.lines.length>1?p.lines.map(short).join(' · '):short(p.lines[0]||KIND[p.kind]))}</span>${kppTags(p)}`;
  const n=p.near;let s=n?`<span class="tag walk">${n.t} мин пешком</span><span>${dots(n.st.l||[])} м. ${esc(n.st.n)}</span>`:'<span>Рядом нет станций в расчёте</span>';
  if(ADMIN&&p.raw.c)s+='<span class="tag warn">уточнить</span>';
  return s;
}
function renderList(){
  const v=visible();
  const nst=v.filter(p=>p.type==='st').length,nad=v.length-nst;
  $('#list').innerHTML=v.length
    ?`<div class="count">${plural(v.length,'место','места','мест')}${state.q?' по запросу':''}</div>`+v.map(p=>`<button class="item${state.sel===p.id?' active':''}" role="listitem" data-id="${p.id}">${icon(p)}<span><span class="t">${esc(p.name)}</span><span class="s">${sub(p)}</span></span></button>`).join('')
    :`<div class="empty"><b>Ничего не нашли</b>Попробуйте название станции или улицы${state.kpp.size?', или снимите фильтр по коробке — для адресов он не указан':''}.</div>`;
  $$('#list .item').forEach(b=>{
    b.onclick=()=>select(b.dataset.id,true);
    b.onmouseenter=()=>hover(b.dataset.id);b.onmouseleave=()=>hover(null);
  });

}

/* ---------- detail ---------- */
const ymPoint=p=>`https://yandex.ru/maps/?pt=${p.lon},${p.lat}&z=17&l=map`;
const ymRoute=(a,b)=>`https://yandex.ru/maps/?rtext=${a?a.lat+','+a.lon:''}~${b.lat},${b.lon}&rtt=${a?'pd':'mt'}`;
function nearRow(name,lines,t,d,href,id){
  return `<li><button data-go="${id}"><div class="nm">${lines?dots(lines):''}${esc(name)}</div><div class="mt">${d?d+' м · ':''}<a href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">маршрут</a></div></button><div class="time">${t}<small> мин</small></div></li>`;
}
function renderDetail(p){
  let h=`<button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Все места</button>`;

    h+=`<h2>${esc(p.name)}</h2><div class="kind">${p.lines.map(l=>`<span class="line-badge">${dots([l])}${esc(l)}</span>`).join('')}${kppTags(p)}</div>
      <div class="how"><b>Место встречи</b>Инструктор встречает у станции ${p.kind==='МЦД'?'МЦД':p.kind==='МЦК'?'МЦК':'метро'}. Точный выход согласуйте при записи.</div>`;
    if(ads.length)h+=`<div class="sec"><h3>Площадки рядом, пешком</h3><ul class="near">${ads.map(a=>nearRow(a.p.n,null,a.t,a.d,ymRoute(p,a.p),a.p.id)).join('')}</ul></div>`;
    h+=`<div class="actions"><a class="btn primary" href="${ymRoute(null,p)}" target="_blank" rel="noopener">Как добраться</a><a class="btn" href="${ymPoint(p)}" target="_blank" rel="noopener">Яндекс Карты</a></div>`;
  }else{

    h+=`<div class="sec"><h3>Ближайшие станции, пешком</h3>${r.nb.length?`<ul class="near">${r.nb.map(n=>{const s=stationInfo(n.s);return s?nearRow(s.n,s.l,n.t,n.d,ymRoute(s,p),ST[n.s]?.m?n.s:''):''}).join('')}</ul>`:'<p class="note">Станций в пешей доступности не найдено.</p>'}</div>`;
    if(ADMIN&&r.c)h+=`<div class="warnbox">${esc(r.c)}</div>`;

  $('#detail').innerHTML=h;

function select(id,fly){

/* ---------- map ---------- */
let map,ready=false;
const fc=f=>({type:'FeatureCollection',features:f});
const pt=(p,props)=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]},properties:props});
function placeFeature(p){return pt(p,{id:p.id,type:p.type,name:p.name,color:p.type==='st'?lineColor(p.lines[0]):'#151717',kind:p.kind})}

function initMap(){
  try{
    map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[37.62,55.75],zoom:9.3,minZoom:7,maxZoom:18,attributionControl:{compact:true},cooperativeGestures:innerWidth<=820,dragRotate:false,pitchWithRotate:false});
  }catch(e){document.body.classList.add('no-map');return}
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}}),'top-right');
  map.on('error',e=>console.warn(e.error));
  map.on('load',()=>{
    /* tone down the basemap so our data reads first */
    for(const l of map.getStyle().layers){
      if(l.type==='symbol'&&/poi|housenumber/.test(l.id))map.setLayoutProperty(l.id,'visibility','none');
      if(l.type==='symbol'&&l.paint&&'text-color'in l.paint)map.setPaintProperty(l.id,'text-color','#8b9096');
      if(l.type==='symbol'&&JSON.stringify(l.layout?.['text-field']||'').includes('name'))map.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ru'],['get','name']]);
    }
    const img=new Image(96,96);
    img.onload=()=>{map.addImage('koleso',img,{pixelRatio:2});addLayers()};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="-6 -6 76 76"><circle cx="32" cy="32" r="35" fill="#fff"/>${LOGO}</svg>`);
  });
}

function addLayers(){
  const allSt=Object.entries(D.allst).map(([id,s])=>pt(s,{id,name:s.n}));
  map.addSource('lines',{type:'geojson',data:fc(D.lines.map(l=>({type:'Feature',geometry:{type:'MultiLineString',coordinates:l.g},properties:{c:l.c,k:l.k,n:l.n}})))});
  map.addSource('allst',{type:'geojson',data:fc(allSt)});
  map.addSource('places',{type:'geojson',data:fc([]),cluster:true,clusterRadius:42,clusterMaxZoom:11});
  map.addSource('links',{type:'geojson',data:fc([])});
  map.addSource('sel',{type:'geojson',data:fc([])});
  const w=['interpolate',['linear'],['zoom'],8,1.6,11,3,14,5];
  map.addLayer({id:'lines-casing',type:'line',source:'lines',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#fff','line-width':['interpolate',['linear'],['zoom'],8,3,11,5.5,14,8.5],'line-opacity':.9}});
  map.addLayer({id:'lines-metro',type:'line',source:'lines',filter:['==',['get','k'],'Метро'],layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':['get','c'],'line-width':w,'line-opacity':.8}});
  map.addLayer({id:'lines-rail',type:'line',source:'lines',filter:['!=',['get','k'],'Метро'],layout:{'line-join':'round'},paint:{'line-color':['get','c'],'line-width':w,'line-opacity':.75,'line-dasharray':[2,1.2]}});
  map.addLayer({id:'allst',type:'circle',source:'allst',minzoom:11,paint:{'circle-radius':['interpolate',['linear'],['zoom'],11,2,15,4],'circle-color':'#fff','circle-stroke-color':'#9aa0a5','circle-stroke-width':1.2}});
  map.addLayer({id:'allst-label',type:'symbol',source:'allst',minzoom:13.5,layout:{'text-field':['get','name'],'text-font':['Noto Sans Regular'],'text-size':11,'text-offset':[0,1],'text-anchor':'top','text-optional':true},paint:{'text-color':'#7c8288','text-halo-color':'#fff','text-halo-width':1.4}});
  map.addLayer({id:'links',type:'line',source:'links',layout:{'line-cap':'round'},paint:{'line-color':'#151717','line-width':2,'line-dasharray':[0,2],'line-opacity':.7}});
  map.addLayer({id:'clusters',type:'circle',source:'places',filter:['has','point_count'],paint:{'circle-color':'#f5ce00','circle-radius':['step',['get','point_count'],15,5,19,15,24],'circle-stroke-color':'#fff','circle-stroke-width':3}});
  map.addLayer({id:'cluster-n',type:'symbol',source:'places',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-font':['Noto Sans Bold'],'text-size':14,'text-allow-overlap':true},paint:{'text-color':'#151717'}});
  const single=['!',['has','point_count']];
  map.addLayer({id:'st',type:'circle',source:'places',filter:['all',single,['==',['get','type'],'st']],paint:{'circle-radius':['interpolate',['linear'],['zoom'],9,6,14,9],'circle-color':['case',['boolean',['feature-state','hover'],false],'#fff6c7','#fff'],'circle-stroke-color':['get','color'],'circle-stroke-width':['interpolate',['linear'],['zoom'],9,3.5,14,4.5]}});
  map.addLayer({id:'ad',type:'symbol',source:'places',filter:['all',single,['==',['get','type'],'ad']],layout:{'icon-image':'koleso','icon-size':['interpolate',['linear'],['zoom'],9,.62,14,.85],'icon-allow-overlap':true}});
  map.addLayer({id:'place-label',type:'symbol',source:'places',filter:single,minzoom:11.5,layout:{'text-field':['get','name'],'text-font':['Noto Sans Bold'],'text-size':12.5,'text-variable-anchor':['left','right','top','bottom'],'text-radial-offset':1.7,'text-justify':'auto','text-max-width':10,'text-optional':true},paint:{'text-color':'#151717','text-halo-color':'#fff','text-halo-width':1.8}});
  map.addLayer({id:'sel-ring',type:'circle',source:'sel',paint:{'circle-radius':20,'circle-color':'rgba(245,206,0,.28)','circle-stroke-color':'#151717','circle-stroke-width':2.5}});
  map.moveLayer('st');map.moveLayer('ad');map.moveLayer('place-label');

  const tip=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:14});
  let hovered=null;
  for(const id of ['st','ad']){
    map.on('mousemove',id,e=>{map.getCanvas().style.cursor='pointer';const f=e.features[0];tip.setLngLat(f.geometry.coordinates).setText(f.properties.name).addTo(map);hoverList(f.properties.id)});
    map.on('mouseleave',id,()=>{map.getCanvas().style.cursor='';tip.remove();hoverList(null)});
    map.on('click',id,e=>select(e.features[0].properties.id,false));
  }
  map.on('mouseenter','clusters',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','clusters',()=>map.getCanvas().style.cursor='');
  map.on('click','clusters',async e=>{const f=e.features[0];const z=await map.getSource('places').getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:z+.3})});
  ready=true;renderList();highlight(state.sel&&BY_ID[state.sel],false);
}

let firstFit=true;
function updateMap(v){
  renderMarks();
  if(!ready)return;
  map.getSource('places').setData(fc(v.map(placeFeature)));
  const pts=v.map(p=>[p.lon,p.lat]);
  if(pts.length&&(state.q||firstFit)){
    const b=pts.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(pts[0],pts[0]));
    map.fitBounds(b,{padding:innerWidth<=820?40:{top:70,bottom:60,left:60,right:60},maxZoom:14,duration:firstFit?0:600});
    firstFit=false;
  }
}
function highlight(p,fly){
  if(!ready)return;
  map.getSource('sel').setData(fc(p?[pt(p,{})]:[]));
  let links=[];
  if(p){
    const others=p.type==='ad'?p.raw.nb.map(n=>stationInfo(n.s)).filter(Boolean):(AD_BY_ST[p.id]||[]).map(a=>a.p);
    links=others.map(o=>({type:'Feature',geometry:{type:'LineString',coordinates:[[p.lon,p.lat],[o.lon,o.lat]]},properties:{}}));
    if(fly){
      if(others.length){const b=others.reduce((b,o)=>b.extend([o.lon,o.lat]),new maplibregl.LngLatBounds([p.lon,p.lat],[p.lon,p.lat]));map.fitBounds(b,{padding:90,maxZoom:15.5,duration:700})}
      else map.flyTo({center:[p.lon,p.lat],zoom:Math.max(map.getZoom(),14.5),duration:700});
    }
  }
  map.getSource('links').setData(fc(links));
}
function hover(id){ /* list -> map */
  if(sc.ready&&view==='scheme'&&!sc.pinned){const p=id&&BY_ID[id];const sid=p&&(p.type==='st'?p.id:(p.raw.nb[0]||{}).s);focusStation(sid&&MEET.has(sid)?sid:null)}
  if(!ready)return;
  map.getSource('sel').setData(fc(id?[pt(BY_ID[id],{})]:state.sel?[pt(BY_ID[state.sel],{})]:[]));
}
function hoverList(id){ /* map -> list */
  $$('#list .item.hover').forEach(b=>b.classList.remove('hover'));
  if(id){const b=$(`#list .item[data-id="${CSS.escape(id)}"]`);if(b){b.classList.add('hover');b.scrollIntoView({block:'nearest'})}}
}

/* ---------- metro scheme: Yandex Metro scheme, drawn 1:1 from its data ---------- */
const SC=D.scheme, SCHEME_URL=window.KOLESO_SCHEME_URL||'metro-scheme.svg';
const NS='http://www.w3.org/2000/svg',VB0=SC.vb,W0=VB0[2],H0=VB0[3];
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const fold2=s=>fold(s).replace(/[\s\-.«»"—]/g,'');
const SPOT_R=230, PICK_R=60, SEEK_R=420, GLOW_R=24;
SC.k={};
let sc={ready:false,loading:false,vb:[...VB0],tvb:null,svg:null,k:1,glows:{},target:null,pinned:null,spot:{x:0,y:0,r:0,tx:0,ty:0,tr:0}};

function meetIds(){return new Set(visible().filter(p=>p.type==='st'&&SC.pos[p.id]).map(p=>p.id))}
let MEET=new Set();

async function loadScheme(){
  if(sc.ready||sc.loading)return;sc.loading=true;
  const host=$('#scheme');
  let txt;
  try{const r=await fetch(SCHEME_URL);if(!r.ok)throw Error(r.status);txt=await r.text()}
  catch(e){console.warn(e);sc.loading=false;const m=document.createElement('div');m.className='sc-msg';m.textContent='Схема метро не загрузилась. Обновите страницу.';host.append(m);return}
  const svg=document.importNode(new DOMParser().parseFromString(txt,'image/svg+xml').documentElement,true);
  svg.setAttribute('role','img');svg.setAttribute('aria-label','Схема метро Москвы с местами занятий');host.prepend(svg);
  const gGlow=el('g',{id:'glows'});svg.querySelector('.scheme-objects-view__decorations').after(gGlow);   /* highlighter under the lines */
  /* Yandex label groups: tie each to the station it names (same name, nearest on the scheme) */
  sc.labels=[...svg.querySelectorAll('#labels .scheme-objects-view__label')].map((g,i)=>{
    const tx=g.querySelector('text');if(!tx)return null;
    const tt=[...g.querySelectorAll('text')];const name=fold2(tt[tt.length-1].textContent);
    const bb=tx.getBBox();let best=null,bd=1e9;
    for(const s of SC.st){if(fold2(s.n)!==name)continue;const d=Math.hypot(s.x-(bb.x+bb.width/2),s.y-(bb.y+bb.height/2));if(d<bd){bd=d;best=s}}
    const id=best?best.id:null;const key='Y|'+i;g.classList.add('lb');g.dataset.k=key;SC.k[key]=id;
    return{el:g,id,ids:id?[id]:[]};
  }).filter(Boolean);
  sc.veil=el('path',{id:'veil','fill-rule':'evenodd',d:''},svg);
  sc.gPins=el('g',{id:'pins'},svg);
  sc.svg=svg;sc.gGlow=gGlow;
  sc.ready=true;bindScheme();renderMarks();startView();
  if(state.sel)schemeSelect(BY_ID[state.sel],true);
}
function startView(){const r=$('#scheme').getBoundingClientRect(),w=Math.min(1500,W0),h=w*r.height/r.width;sc.vb=[1520-w/2,1560-h/2,w,h];applyVB()}

/* meeting markers: highlighter glow under the line + bold label; pins appear when zoomed in */
const PIN=`<path d="M0 0C-3-5-11-10-11-18a11 11 0 1 1 22 0C11-10 3-5 0 0Z" fill="#151717" stroke="#fff" stroke-width="2"/><circle cx="0" cy="-18" r="6.2" fill="none" stroke="#f5ce00" stroke-width="2.4"/><path d="M-1.4-21.2v6.4l4.4-3.2z" fill="#fff"/>`;
function renderMarks(){
  if(!sc.ready)return;MEET=meetIds();
  sc.gGlow.replaceChildren();sc.gPins.replaceChildren();sc.glows={};sc.pins={};
  for(const id of MEET){const[x,y]=SC.pos[id];
    const g=el('g',{class:'pin hide','data-x':x,'data-y':y},sc.gPins);g.innerHTML=PIN;sc.pins[id]=g;}
  sc.labels.forEach(l=>l.el.classList.toggle('meet',l.ids.some(i=>MEET.has(i))));
  if(sc.target&&!MEET.has(sc.target))setTarget(null);
  layoutPins();
}
function layoutPins(){
  if(!sc.ready)return;const k=sc.k,near=k>=1.6;
  for(const[id,g]of Object.entries(sc.pins)){
    const show=near||id===sc.target;g.classList.toggle('hide',!show);
    g.setAttribute('transform',`translate(${g.dataset.x} ${g.dataset.y-8/k}) scale(${1/k})`);
  }
}

/* nearest station to a point, nearest meeting station to a station */
function nearestStation(x,y,max){let b=null,bd=max;for(const s of SC.st){const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;b=s}}return b}
function nearestMeet(x,y,max){let b=null,bd=max;for(const id of MEET){const[px,py]=SC.pos[id];const d=Math.hypot(px-x,py-y);if(d<bd){bd=d;b=id}}return b}
function stopsBetween(from,toId){ /* stops along the same line, if any */
  const to=SC.st.find(s=>s.id===toId);if(!from||!to)return null;
  for(const l of D.lines){const a=l.st.indexOf(from.id),b=l.st.indexOf(toId);if(a>=0&&b>=0)return Math.abs(a-b)}
  return null;
}

/* spotlight target */
function setTarget(id,fromStation){
  sc.target=id;sc.from=fromStation||null;
  if(id){const[x,y]=SC.pos[id],R=SPOT_R;
    sc.veil.setAttribute('d',`M-6000-6000H9000V9000H-6000Z M${x-R} ${y}a${R} ${R} 0 1 0 ${2*R} 0a${R} ${R} 0 1 0 ${-2*R} 0Z`)}
  sc.veil.classList.toggle('on',!!id);
  renderCard();layoutPins();hoverList(id);
}

/* view box easing runs only while zooming */
function kick(){if(!sc.raf)sc.raf=requestAnimationFrame(step)}
function step(){
  sc.raf=0;if(!sc.tvb)return;
  const v=sc.vb,t=sc.tvb;let done=true;for(let i=0;i<4;i++){v[i]+=(t[i]-v[i])*.25;if(Math.abs(t[i]-v[i])>.3)done=false}
  if(done){sc.vb=[...t];sc.tvb=null}applyVB();if(!done)kick();
}
function applyVB(){
  if(!sc.svg)return;
  sc.svg.setAttribute('viewBox',sc.vb.map(v=>v.toFixed(2)).join(' '));
  const k=$('#scheme').clientWidth/sc.vb[2];
  if(Math.abs(k-sc.k)>.0005){sc.k=k;layoutPins()}
  placeCard();
}

/* callout card anchored to the target station */
function renderCard(){
  const box=$('#sc-card');const id=sc.target;
  if(!id){box.classList.remove('on');return}
  const p=BY_ID[id],ads=(AD_BY_ST[id]||[]).sort((a,b)=>a.t-b.t);
  let from='';
  if(sc.from&&sc.from.id!==id){const n=stopsBetween(sc.from,id);from=`<div class="from">От «${esc(sc.from.n)}» ближайшее место занятий${n?` — ${plural(n,'остановка','остановки','остановок')}`:''}</div>`}
  box.innerHTML=from+`<b>${esc(p.name)}</b><div class="r">${p.lines.map(l=>`${dots([l])}${esc(short(l))}`).join(' · ')}</div>`+
    `<div class="r ok">Инструктор встречает у станции${p.kpp.length?' · '+p.kpp.map(k=>k==='mt'?'МКПП':'АКПП').join(', '):''}</div>`+
    (ads.length?`<div class="r">Площадки рядом: ${ads.slice(0,2).map(a=>esc(a.p.n)+', '+a.t+' мин').join('; ')}</div>`:'')+
    `<div class="more"><button type="button" data-open="${id}">Подробнее</button></div>`;
  box.querySelector('[data-open]').onclick=()=>select(id,false);
  box.classList.add('on');placeCard();
}
function placeCard(){
  const box=$('#sc-card');if(!sc.target||!box.classList.contains('on'))return;
  const[x,y]=SC.pos[sc.target],m=sc.svg.getScreenCTM(),r=$('#scheme').getBoundingClientRect();
  const sx=m.a*x+m.e-r.left,sy=m.d*y+m.f-r.top;
  const w=box.offsetWidth,h=box.offsetHeight;
  let left=Math.min(Math.max(sx-30,12),r.width-w-12),top=sy+22,below=false;
  if(top+h>r.height-12){top=sy-h-34;below=true}
  box.classList.toggle('below',below);box.style.left=left+'px';box.style.top=top+'px';box.style.setProperty('--ax',Math.min(Math.max(sx-left-6,14),w-26)+'px');
}

/* pointer: hover picks the nearest station, the spotlight goes to the nearest place with lessons */
function toScheme(e){const m=sc.svg.getScreenCTM().inverse();return[m.a*e.clientX+m.c*e.clientY+m.e,m.b*e.clientX+m.d*e.clientY+m.f]}
function pickAt(e){
  const tgt=e.target.closest&&e.target.closest('.lb,.scheme-objects-view__station');
  if(!tgt)return null;
  let st=null;
  if(tgt.classList.contains('lb')){const id=SC.k[tgt.dataset.k];st=id&&SC.st.find(s=>s.id===id)}
  if(!st){const b=tgt.getBBox();st=nearestStation(b.x+b.width/2,b.y+b.height/2,40)}
  if(!st)return null;
  const id=MEET.has(st.id)?st.id:nearestMeet(st.x,st.y,SEEK_R);
  return id?{id,st}:null;
}
let leaveT;
function bindScheme(){
  const box=$('#scheme');let drag=null,moved=false;const ptrs=new Map();
  box.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId)){ptrs.set(e.pointerId,e);
      if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(drag.d)zoomAt(drag.d/d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,false);drag.d=d;return}
      if(drag){const k=sc.vb[2]/box.clientWidth,dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
        if(moved){sc.tvb=null;sc.vb[0]-=dx*k;sc.vb[1]-=dy*k;drag.x=e.clientX;drag.y=e.clientY;applyVB();box.classList.add('drag')}}
      return}
    if(e.pointerType!=='mouse'||sc.pinned||e.target.closest('#sc-card'))return;
    const hit=pickAt(e);
    if(hit){clearTimeout(leaveT);if(hit.id!==sc.target||hit.st!==sc.from)setTarget(hit.id,hit.st)}
    else if(sc.target){clearTimeout(leaveT);leaveT=setTimeout(()=>{if(!sc.pinned)setTarget(null)},120)}
  });
  box.addEventListener('pointerdown',e=>{if(e.target.closest('#sc-card'))return;ptrs.set(e.pointerId,e);box.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};moved=false});
  const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);box.classList.remove('drag');
    if(!moved&&!ptrs.size){const hit=pickAt(e);
      if(hit&&hit.st.id===hit.id)select(hit.id,false);
      else if(hit){sc.pinned=hit.id;setTarget(hit.id,hit.st)}
      else{sc.pinned=null;if(state.sel)select(null);else setTarget(null)}}
    if(!ptrs.size)drag=null};
  box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  box.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!sc.pinned){clearTimeout(leaveT);leaveT=setTimeout(()=>setTarget(null),260)}});
  box.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*(e.ctrlKey?.012:.0022)),e.clientX,e.clientY,true)},{passive:false});
  $$('#sc-zoom button').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(!z)return fitScheme(true);const r=box.getBoundingClientRect();zoomAt(1/z,r.left+r.width/2,r.top+r.height/2,true)});
}
function zoomAt(f,cx,cy,anim){
  const r=$('#scheme').getBoundingClientRect(),base=sc.tvb||sc.vb,[x,y,w,h]=base;
  const nw=Math.min(Math.max(w*f,320),W0*1.3),k=nw/w;
  const px=x+(cx-r.left)/r.width*w,py=y+(cy-r.top)/r.height*h;
  const to=[px-(px-x)*k,py-(py-y)*k,nw,h*k];
  if(anim){sc.tvb=to;kick()}else{sc.tvb=null;sc.vb=to;applyVB()}
}
function fitScheme(anim){const r=$('#scheme').getBoundingClientRect(),a=r.width/r.height;
  let w=W0,h=H0;if(w/h<a)w=h*a;else h=w/a;const to=[VB0[0]+(W0-w)/2,VB0[1]+(H0-h)/2,w,h];
  if(anim){sc.tvb=to;kick()}else{sc.vb=to;applyVB()}}
function schemeSelect(p,fly){
  if(!sc.ready)return;
  if(!p){sc.pinned=null;setTarget(null);return}
  const sid=p.type==='st'?p.id:(p.raw.nb.find(n=>SC.pos[n.s]&&MEET.has(n.s))||p.raw.nb.find(n=>SC.pos[n.s])||{}).s;
  if(!sid||!SC.pos[sid])return;
  const id=MEET.has(sid)?sid:nearestMeet(...SC.pos[sid],SEEK_R);
  sc.pinned=id||null;if(id)setTarget(id,SC.st.find(s=>s.id===sid));
  if(fly){const[x,y]=SC.pos[sid],r=$('#scheme').getBoundingClientRect(),w=Math.min(sc.vb[2],1100),h=w*r.height/r.width;sc.tvb=[x-w/2,y-h/2,w,h];kick()}
}
function focusStation(sid){ /* list hover -> spotlight */
  if(!sc.ready||sc.pinned)return;
  if(!sid)return setTarget(null);
  if(MEET.has(sid))setTarget(sid,null);
}
function card(){}

/* ---------- view switching ---------- */
let view='scheme';
function setView(v){
  view=v;$('#app').classList.toggle('is-scheme',v==='scheme');$('#app').classList.toggle('is-map',v==='map');
  $('#v-scheme').setAttribute('aria-selected',v==='scheme');$('#v-map').setAttribute('aria-selected',v==='map');
  $('#scheme').hidden=v!=='scheme';$('#sc-zoom').hidden=v!=='scheme';$('#map').style.visibility=v==='map'?'visible':'hidden';
  if(v==='scheme'){loadScheme();requestAnimationFrame(()=>applyVB())}
  if(v==='map'){if(!map&&window.maplibregl)initMap();else if(map){map.resize();highlight(state.sel&&BY_ID[state.sel],true)}}
}
$('#v-scheme').onclick=()=>setView('scheme');$('#v-map').onclick=()=>setView('map');

/* ---------- controls ---------- */
const nst=PLACES.filter(p=>p.type==='st').length,nad=PLACES.length-nst;
$('#n-st').textContent=nst;$('#n-ad').textContent=nad;
$('#stats').innerHTML=`<div class="stat"><b>${PLACES.length}</b><span>мест встречи</span></div><div class="stat"><b>${nst}</b><span>у метро и МЦД</span></div><div class="stat"><b>${nad}</b><span>по адресу</span></div>`;
$('#foot').textContent=`Данные обновлены ${D.date}. Карта © OpenStreetMap, OpenFreeMap.`;
let t;$('#q').oninput=e=>{state.q=e.target.value;$('#searchbox').classList.toggle('has-value',!!state.q);clearTimeout(t);t=setTimeout(()=>{if(state.sel)select(null);renderList()},120)};
$('#clear').onclick=()=>{$('#q').value='';$('#q').dispatchEvent(new Event('input'));$('#q').focus()};
$$('.seg button').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));select(null);renderList()});
$$('[data-kpp]').forEach(b=>b.onclick=()=>{const k=b.dataset.kpp;state.kpp.has(k)?state.kpp.delete(k):state.kpp.add(k);b.setAttribute('aria-pressed',state.kpp.has(k));select(null);renderList()});
$('#mcd').onclick=e=>{state.mcd=!state.mcd;e.currentTarget.setAttribute('aria-pressed',state.mcd);select(null);renderList()};
$('#toggle-lines').onclick=e=>{state.lines=!state.lines;e.currentTarget.setAttribute('aria-pressed',state.lines);if(ready)for(const l of['lines-casing','lines-metro','lines-rail','allst','allst-label'])map.setLayoutProperty(l,'visibility',state.lines?'visible':'none')};
addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sel)select(null)});

renderList();
setView(new URLSearchParams(location.search).get('view')==='map'?'map':'scheme');
});
</script>

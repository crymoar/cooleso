#marks .mk,#hl .mk{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
:root{
  --ink:#151717;--ink-2:#3b3f43;--muted:#6f757b;--line:#e7e7e2;--bg:#f5f5f1;--surface:#fff;
  --brand:#f5ce00;--brand-soft:#fff6c7;--ok:#1d7a4f;--ok-soft:#e6f4ec;--warn:#9a6200;--warn-soft:#fff3d6;
  --radius:14px;--shadow:0 6px 24px rgba(21,23,23,.10),0 1px 3px rgba(21,23,23,.08);
  --panel:400px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:500 15px/1.45 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2d6cdf;outline-offset:2px}

.app{display:grid;grid-template-columns:var(--panel) 1fr;height:100dvh}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line);z-index:2}
.map-wrap{position:relative;min-width:0}
#map{position:absolute;inset:0;background:#eef0ea}

/* header */
.head{padding:20px 20px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{margin:0;font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--bg);border-radius:12px;padding:9px 11px}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* controls */
.controls{padding:0 20px 12px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;padding:0 40px 0 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:15px;transition:border-color .15s}
.search input::placeholder{color:#9aa0a5;font-weight:500}
.search input:focus{outline:none;border-color:var(--ink)}
.search .clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--muted);display:none}
.search.has-value .clear{display:block}
.seg{display:flex;gap:4px;margin-top:10px;padding:4px;background:var(--bg);border-radius:12px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;transition:background .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.controls .seg{margin-top:0}
.seg button:disabled{opacity:.35;cursor:default}
.seg-s button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg-s .ld{width:9px;height:9px;box-shadow:none}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:#151717}
.fnote{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--bg);font-size:12.5px;line-height:1.35;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{height:32px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .tick{display:none}
.chip[aria-pressed=true] .tick{display:inline}

/* list */
.list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 10px 16px}
.count{padding:8px 10px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;width:100%;text-align:left;padding:11px 10px;border:0;border-radius:12px;background:none}
.item:hover,.item.hover{background:var(--bg)}
.item.active{background:var(--brand-soft)}
.ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.ico.st{background:#fff;border:3.5px solid var(--c,#999);color:var(--ink)}
.ico.ad{background:var(--ink);color:var(--brand)}
.ico.ad svg{width:14px;height:14px}
.ico.mk{width:18px;height:18px;margin:5px;border-radius:50%;box-shadow:0 0 0 2.5px #fff,0 1px 3px rgba(0,0,0,.35)}
.ico.of{width:20px;height:20px;margin:4px;border-radius:5px;background:#151717;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ico.of i{width:7px;height:7px;border-radius:50%;background:#f5ce00}
.ico.ad{background:var(--bg);color:var(--ink-2)}
.item span.s{flex-wrap:nowrap;min-width:0;align-items:center;min-height:22px;line-height:22px}

.item .s .kp{line-height:22px}
.item .s .ln{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.item .s .ln>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s .flabel{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 2px 6px}
.controls .seg{margin-top:0}
.seg button:disabled{opacity:.35;cursor:default}
.seg-s button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg-s .ld{width:9px;height:9px;box-shadow:none}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:#151717}
.fnote{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--bg);font-size:12.5px;line-height:1.35;color:var(--muted);font-weight:600}
.chips{display:inline-flex;gap:4px;flex:none}
.item>span:last-child{min-width:0}
.kp.none{font-weight:700}
.item .t{font-weight:700;font-size:15px;line-height:1.3}
.item .s{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;font-size:13px;color:var(--muted);font-weight:600}
.dots{display:inline-flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--bg);color:var(--ink-2);font-size:11.5px;font-weight:700}
.tag.walk{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* detail */
.detail{display:none;flex:1;min-height:0;overflow:auto;padding:14px 20px 20px}
.panel.show-detail .detail{display:block}
.panel.show-detail .list{display:none}
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;margin-left:-6px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--ink-2)}

.sec{margin-top:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

.warnbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}

#scheme{position:absolute;inset:0;background:#fff}

.sc-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}

#objects,#labels,#marks{transition:opacity .55s cubic-bezier(.4,0,.2,1)}
#hl{opacity:0;pointer-events:none;transition:opacity .55s cubic-bezier(.4,0,.2,1)}
.hl #objects,.hl #labels,.hl #marks{opacity:.16}
.hl #hl{opacity:1}

#scheme .lb.meet text{font-weight:700}
.glow{fill:var(--brand);opacity:.45;transition:opacity .3s}
.glow.on{opacity:.95}

.hit{fill:transparent;cursor:pointer}
#veil{fill:#fff;opacity:0;transition:opacity .35s ease;pointer-events:none}
#veil.on{opacity:.78}
.pin{pointer-events:none;transition:opacity .25s}
.pin.hide{opacity:0}

.sc-card{position:absolute;z-index:6;transition:opacity .3s ease .1s,transform .3s ease .1s!important;width:min(280px,calc(100% - 24px));padding:12px 14px 13px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.sc-card.on{opacity:1;transform:none;pointer-events:auto}

<script>
addEventListener('DOMContentLoaded',()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const ADMIN=new URLSearchParams(location.search).has('admin');
const LOGO='<circle cx="32" cy="32" r="32" fill="#151717"/><circle cx="32" cy="32" r="20.5" fill="none" stroke="#f5ce00" stroke-width="5.6"/><path d="M28.6 23.5v17c0 2 2.5 3 3.9 1.6l8.4-8.4c.9-.9.9-2.4 0-3.3l-8.4-8.5c-1.4-1.4-3.9-.4-3.9 1.6z" fill="#fff"/>';
document.getElementById('logo').innerHTML=LOGO;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s).toLowerCase().replaceAll('ё','е');
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const LINE={};D.lines.forEach(l=>LINE[l.n]=l);
const lineColor=n=>(LINE[n]||{}).c||'#8a8f94';
const KIND={'Метро':'метро','МЦК':'МЦК','МЦД':'МЦД'};
const short=n=>n.replace('Большая кольцевая линия','БКЛ').replace('Таганско-Краснопресненская','Таганско-Краснопр.');

/* stations that are meeting points, + every station referenced by an address */
const ST={};D.stations.forEach(s=>ST[s.id]=s);
const stationInfo=id=>(ST[id]&&ST[id].lon>36.5&&ST[id].lon!==ST[id].lat?ST[id]:null)||(D.allst[id]&&{id,...D.allst[id],n:D.allst[id].n,l:D.lines.filter(l=>l.st.includes(id)).map(l=>l.n),k:(D.lines.find(l=>l.st.includes(id))||{}).k||'Метро'});
/* addresses within walking distance of each station */
const AD_BY_ST={};D.points.forEach(p=>p.nb.forEach(n=>(AD_BY_ST[n.s]=AD_BY_ST[n.s]||[]).push({p,t:n.t,d:n.d})));

const PLACES=[
  ...D.stations.map(s=>({id:s.id,type:'st',name:s.n,lat:s.lat,lon:s.lon,kind:s.k,lines:s.l,kpp:s.kpp,raw:s})),
  ...['Долгопрудная','Достоевская'].map(n=>{const id=Object.keys(D.allst).find(k=>D.allst[k].n===n);if(!id||D.stations.some(s=>s.id===id))return null;const a=D.allst[id];
    const L=D.lines.filter(l=>l.st.includes(id));return{id,type:'st',name:a.n,lat:a.lat,lon:a.lon,kind:(L[0]||{}).k||'Метро',lines:L.map(l=>l.n),kpp:['mt'],raw:{m:1,legacy:1}}}).filter(Boolean),
  ...D.points.map(p=>({id:p.id,type:'ad',name:p.n,lat:p.lat,lon:p.lon,kind:'Адрес',lines:[],kpp:[],raw:p})),
  ...D.svc.filter(s=>s.sid).map(s=>{const st=D.allst[s.sid]||{};const L=D.lines.filter(l=>l.st.includes(s.sid)).map(l=>l.n);
    return{id:s.id,type:s.k==='office'?'of':'mo',sub:s.k,name:s.k==='office'?'Офис «Колесо» · '+s.n:'Мотоплощадка · '+s.n,station:s.n,sid:s.sid,lat:s.lat,lon:s.lon,kind:s.k==='office'?'Офис':'Мото',lines:L,kpp:[],note:s.note,raw:s}})
];
PLACES.forEach(p=>{
  if(p.type==='ad'){const n=p.raw.nb[0];p.near=n?{...n,st:stationInfo(n.s)}:null}
  p.search=fold([p.name,...p.lines,p.kind,p.near?.st?.n||'',...(p.raw.nb||[]).map(n=>stationInfo(n.s)?.n||'')].join(' '));
});
const BY_ID=Object.fromEntries(PLACES.map(p=>[p.id,p]));

/* ---------- state ---------- */
const state={q:'',type:'all',kpp:'any',mcd:true,sel:null,lines:false};

/* filters: where (type), gearbox ('mt' also matches stations with both), МЦД/МЦК, search */
function matches(p,skip){
  const q=fold(state.q.trim());
  if(skip!=='type'&&state.type!=='all'&&(state.type==='svc'?!(p.type==='of'||p.type==='mo'):p.type!==state.type))return false;
  if(!state.mcd&&p.type==='st'&&p.kind!=='Метро')return false;
  if(state.kpp!=='any'&&!(p.type==='st'&&p.kpp.includes(state.kpp)))return false;
  if(q&&!p.search.includes(q))return false;
  return true;
}
function visible(){return PLACES.filter(p=>matches(p)).sort((a,b)=>a.name.localeCompare(b.name,'ru'))}
function updateCounts(){
  const base=PLACES.filter(p=>matches(p,'type'));
  const n={all:base.length,st:base.filter(p=>p.type==='st').length,ad:base.filter(p=>p.type==='ad').length,svc:base.filter(p=>p.type==='of'||p.type==='mo').length};
  for(const k in n)$('#n-'+k).textContent=n[k];
  $$('.seg [data-type]').forEach(b=>b.disabled=b.dataset.type!=='all'&&!n[b.dataset.type]);
  const note=$('#fnote');
  if(state.kpp!=='any'){note.hidden=false;note.textContent='Коробка указана только для станций метро, поэтому адреса, офисы и станции без данных о коробке скрыты.'}
  else note.hidden=true;
}

/* ---------- list ---------- */
const HOUSE='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11 12 4l8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg>';
/* same mark as on the scheme: colour = gearbox */
const RINGC={mt:'#f29900',at:'#1f6fe5',both:'#8a4fe0',extra:'#16a06e',office:'#151717',moto:'#e5484d'};
const RINGT={mt:'МКПП',at:'АКПП',both:'МКПП и АКПП',extra:'Дополнительная станция',office:'Офис',moto:'Мото'};
/* same ring as on the scheme */
function icon(p){
  if(p.type==='ad')return `<span class="ico ad" title="Встреча по адресу">${HOUSE}</span>`;
  const sv=svcOf(p),walk=(AD_BY_ST[p.sid||p.id]||[]).length;
  return `<span class="ico rg${sv==='office'||sv==='moto'?' big':''}" style="--c:${RINGC[sv]};--f:${walk?'#daf2e3':'#fff'}" title="${RINGT[sv]}"></span>`;
}

/* centre on a marker and zoom until it leaves its cluster; at max zoom fan the cluster out */
function reveal(map,cluster,m,minZoom,done){
  if(!cluster.hasLayer(m))return;
  const step=()=>{
    if(!cluster.hasLayer(m))return;
    const par=cluster.getVisibleParent(m);
    if(!par||par===m){done&&done();return}
    if(map.getZoom()>=map.getMaxZoom()){par.spiderfy&&par.spiderfy();done&&done();return}
    map.once('moveend',step);map.setView(m.getLatLng(),Math.min(map.getZoom()+1,map.getMaxZoom()),{animate:true});
  };

let cityMap=null,cityCluster,cityLines,cityLinks,cityMarkers={};
function cityPin(p){

    iconSize:[44,54],iconAnchor:[22,52],popupAnchor:[0,-46],tooltipAnchor:[18,-30]});
}
function initCity(){
  if(cityMap)return;
  if(typeof L==='undefined'){document.body.classList.add('no-map');return}
  cityMap=L.map('map',{maxZoom:19,minZoom:8,zoomControl:false}).setView([55.75,37.62],10);
  cityMap.attributionControl.setPrefix(false);              /* no Leaflet flag */
  L.control.zoom({position:'bottomright'}).addTo(cityMap);
  const attr='<a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
  try{
    if(!L.maplibreGL)throw Error('no maplibre');
    const gl=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/positron',interactive:false,attribution:attr}).addTo(cityMap);
    const m=gl.getMaplibreMap();
    m.on('load',()=>{for(const l of m.getStyle().layers){
      if(l.type==='symbol'&&/poi|housenumber/.test(l.id))m.setLayoutProperty(l.id,'visibility','none');
      if(l.type==='symbol'&&JSON.stringify(l.layout?.['text-field']||'').includes('name'))m.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ru'],['get','name']]);
    }});

  }catch(e){L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(cityMap)}
  cityLines=L.layerGroup(D.lines.map(l=>L.polyline(l.g.map(seg=>seg.map(([lon,lat])=>[lat,lon])),{color:l.c,weight:3,opacity:.75,dashArray:l.k==='Метро'?null:'6 5',interactive:false})));

function updateCity(v){
  if(!cityMap)return;
  cityCluster.clearLayers();cityMarkers={};
  const ms=v.map(p=>{const m=L.marker([p.lat,p.lon],{icon:cityPin(p),title:p.name,keyboard:false});
    m.bindTooltip(esc(p.name),{direction:'top'});
    m.on('click',()=>select(p.id,cityMap.getZoom()<15));m.on('mouseover',()=>hoverList(p.id));m.on('mouseout',()=>hoverList(null));
    cityMarkers[p.id]=m;return m});
  if(ms.length&&(state.q||firstFit)){cityMap.fitBounds(L.latLngBounds(v.map(p=>[p.lat,p.lon])),{padding:[30,30],maxZoom:15,animate:false});firstFit=false}
  cityCluster.addLayers(ms.splice(0,ms.length>40?ms.length:0));ms.forEach(m=>cityCluster.addLayer(m));
}
function highlightCity(p,fly){
  if(!cityMap)return;
  cityLinks.clearLayers();if(!p)return;
  const others=p.type==='ad'?p.raw.nb.map(n=>stationInfo(n.s)).filter(Boolean):(AD_BY_ST[p.sid||p.id]||[]).map(a=>a.p);
  others.forEach(o=>L.polyline([[p.lat,p.lon],[o.lat,o.lon]],{color:'#151717',weight:2,opacity:.7,dashArray:'2 6',interactive:false}).addTo(cityLinks));
  if(fly){const m=cityMarkers[p.id];if(m)reveal(cityMap,cityCluster,m,15,()=>m.openTooltip())}
}
function hover(id){ /* list -> map */
  if(view==='scheme'&&sc.ready&&!sc.pinned)setTarget(id&&SM_MARK[id]?id:null);
  if(view==='map'&&cityMap){Object.values(cityMarkers).forEach(m=>m.closeTooltip());const m=id&&cityMarkers[id];if(m&&cityMap.hasLayer(m))m.openTooltip()}
}
function hoverList(id){ /* map -> list */
  $$('#list .item.hover').forEach(b=>b.classList.remove('hover'));
  if(id){const b=$(`#list .item[data-id="${CSS.escape(id)}"]`);if(b){b.classList.add('hover');b.scrollIntoView({block:'nearest'})}}
}

/* ----- metro scheme: Yandex Metro scheme as a flat Leaflet map (CRS.Simple) ----- */
const SC=D.scheme, SCHEME_URL=window.KOLESO_SCHEME_URL||'metro-scheme.svg';
const NS='http://www.w3.org/2000/svg',W0=SC.vb[2],H0=SC.vb[3];
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const fold2=s=>fold(s).replace(/[\s\-.«»"—]/g,'');
const toLL=(x,y)=>[H0-y,x];
const stOf=p=>{const id=p.sid||p.id;return SC.st.find(s=>s.id===id)||null};
let sc={ready:false,loading:false,target:null,pinned:null},sm=null,smCluster=null,SM_MARK={};
async function loadScheme(){
  if(sc.ready||sc.loading)return;
  if(typeof L==='undefined'){document.body.classList.add('no-map');return}
  sc.loading=true;
  let txt;
  try{const r=await fetch(SCHEME_URL);if(!r.ok)throw Error(r.status);txt=await r.text()}
  catch(e){console.warn(e);sc.loading=false;const m=document.createElement('div');m.className='sc-msg';m.textContent='Схема метро не загрузилась. Обновите страницу.';$('#scheme').append(m);return}
  const svg=document.importNode(new DOMParser().parseFromString(txt,'image/svg+xml').documentElement,true);
  svg.setAttribute('viewBox',`0 0 ${W0} ${H0}`);
  sm=L.map('scheme',{crs:L.CRS.Simple,minZoom:-2.5,maxZoom:1.5,zoomSnap:.25,zoomDelta:.5,wheelPxPerZoomLevel:90,attributionControl:false,zoomControl:false,
    maxBounds:[[-H0*.25,-W0*.25],[H0*1.25,W0*1.25]]});
  sm.createPane('marks').style.zIndex=450;sm.createPane('marktop').style.zIndex=460;sc.top=L.layerGroup().addTo(sm);
  /* station names go to their own layer above the place marks */
  sm.createPane('labels').style.zIndex=470;sm.getPane('labels').style.pointerEvents='none';
  const svgTop=svg.cloneNode(false);const st0=svg.querySelector('style');if(st0)svgTop.appendChild(st0.cloneNode(true));
  svgTop.appendChild(svg.querySelector('#labels'));sc.gHlTop=el('g',{id:'hltop'},svgTop);
  L.svgOverlay(svg,[[0,0],[H0,W0]],{interactive:false}).addTo(sm);
  L.svgOverlay(svgTop,[[0,0],[H0,W0]],{interactive:false,pane:'labels'}).addTo(sm);
  /* labels tied to stations (bold for places), shapes indexed by line colour for the highlight */
  sc.labels=[...svgTop.querySelectorAll('#labels .scheme-objects-view__label')].map(g=>{
    const tt=[...g.querySelectorAll('text')];if(!tt.length)return null;
    const name=fold2(tt[tt.length-1].textContent);const b=tt[0];
    const lx=+(b.getAttribute('x')||0),ly=+(b.getAttribute('y')||0);
    let best=null,bd=1e9;for(const s of SC.st){if(fold2(s.n)!==name)continue;const d=Math.hypot(s.x-lx,s.y-ly);if(d<bd){bd=d;best=s}}
    g.classList.add('lb');return{el:g,id:best?best.id:null,c:new Set(best?best.c:[])};
  }).filter(Boolean);
  const objs=svg.querySelector('#objects');
  sc.shapes=[...objs.querySelectorAll(':scope > g > line, :scope > g > path, :scope > g > g, :scope > line, :scope > path, :scope > g.scheme-objects-view__station, :scope > g.scheme-objects-view__transfers > *')]
    .filter(e=>!e.closest('.scheme-objects-view__decorations'));
  sc.shapes.forEach(e=>{const cs=new Set();[e,...e.querySelectorAll('*')].forEach(n=>{for(const a of ['stroke','fill']){const v=(n.getAttribute(a)||'').toLowerCase();if(/^#[0-9a-f]{6}$/.test(v))cs.add(v)}});e._c=cs});
  sc.svg=svg;sc.gHl=el('g',{id:'hl'},svg);
  smCluster=L.markerClusterGroup(clusterOpts()).addTo(sm);
  sm.on('click',()=>{sc.pinned=null;if(state.sel)select(null);else setTarget(null,true)});
  sm.on('move zoom',placeCard);
  sm.on('zoomend',()=>{for(const[id,m]of Object.entries(SM_MARK)){const st=ringStyle(BY_ID[id]);m.setStyle({weight:st.weight});m.setRadius(st.radius)}sc.top.eachLayer(l=>{const st=ringStyle(BY_ID[sc.target]||{kpp:[]});l.setStyle({weight:st.weight+1});l.setRadius(st.radius+1.5)})});
  $$('#sc-zoom button').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(!z)return fitScheme(true);z>1?sm.zoomIn():sm.zoomOut()});
  sc.ready=true;sc.loading=false;
  startView();updateScheme(visible());
  if(state.sel)schemeSelect(BY_ID[state.sel],true);
}
function startView(){const w=$('#scheme').clientWidth||1000;sm.setView(toLL(1520,1560),Math.log2(w/1500),{animate:false})}
function fitScheme(anim){sm.fitBounds([[0,0],[H0,W0]],{padding:[12,12],animate:!!anim})}
function updateScheme(v){
  if(!sc.ready)return;
  smCluster.clearLayers();SM_MARK={};
  const ms=[];
  for(const p of v){if(p.type==='ad')continue;const s=stOf(p);if(!s)continue;
    const m=L.circleMarker(toLL(s.x,s.y),ringStyle(p));
    m.on('mouseover',()=>{clearTimeout(leaveT);if(!sc.pinned)setTarget(p.id)});
    m.on('mouseout',()=>{clearTimeout(leaveT);if(!sc.pinned)leaveT=setTimeout(()=>setTarget(null),180)});
    m.on('click',e=>{L.DomEvent.stopPropagation(e);select(p.id,sm.getZoom()<-.5)});
    SM_MARK[p.id]=m;ms.push(m)}
  if(state.q&&ms.length)sm.fitBounds(L.latLngBounds(ms.map(m=>m.getLatLng())),{padding:[70,70],maxZoom:-.5,animate:false});if(sm.getZoom()<-1.25)sm.setZoom(-1.25,{animate:false});
  smCluster.addLayers(ms.splice(0,ms.length>40?ms.length:0));ms.forEach(m=>smCluster.addLayer(m)); /* addLayers drops small sets */
  const on=new Set(Object.keys(SM_MARK).map(id=>(BY_ID[id].sid||id)));
  sc.labels.forEach(l=>l.el.classList.toggle('meet',!!l.id&&on.has(l.id)));
  if(sc.target&&!SM_MARK[sc.target])setTarget(null,true);
}

/* hover a place: after a short delay its line lights up, the rest fades, then the card appears */
const HOVER_DELAY=220;let hoverT=null,leaveT=null,hlKey='',hlClear=0;
function cardOff(){$('#sc-card').classList.remove('on')}
function lightLines(cols){
  const svg=sc.svg;clearTimeout(hlClear);
  if(!cols||!cols.size){svg.classList.remove('hl');$('#scheme').classList.remove('hl-on');hlKey='';hlClear=setTimeout(()=>{if(!hlKey){sc.gHl.replaceChildren();sc.gHlTop.replaceChildren()}},600);return}
  const key=[...cols].sort().join();
  if(key!==hlKey){hlKey=key;const has=s=>{for(const c of s)if(cols.has(c))return true;return false};
    const frag=document.createDocumentFragment();
    sc.shapes.forEach(e=>{if(has(e._c))frag.appendChild(e.cloneNode(true))});
    const fl=document.createDocumentFragment();sc.labels.forEach(l=>{if(has(l.c))fl.appendChild(l.el.cloneNode(true))});
    sc.gHl.replaceChildren(frag);sc.gHlTop.replaceChildren(fl)}
  svg.classList.add('hl');$('#scheme').classList.add('hl-on');
}
function setTarget(id,now){
  clearTimeout(hoverT);
  if(!id){sc.target=null;cardOff();if(sc.svg)lightLines(null);sc.top&&sc.top.clearLayers();hoverList(null);return}
  if(id===sc.target)return;
  const go=()=>{const p=BY_ID[id],s=stOf(p);sc.target=id;sc.top.clearLayers();if(s)L.circleMarker(toLL(s.x,s.y),{...ringStyle(p),pane:'marktop',interactive:false,radius:ringStyle(p).radius+1.5,weight:ringStyle(p).weight+1}).addTo(sc.top);
    lightLines(new Set(s?s.c:[]));renderCard();hoverList(id)};
  if(now)go();else hoverT=setTimeout(go,HOVER_DELAY);
}
function renderCard(){
  const box=$('#sc-card'),id=sc.target;if(!id||view!=='scheme'){cardOff();return}
  const p=BY_ID[id],ads=(AD_BY_ST[p.sid||id]||[]).sort((a,b)=>a.t-b.t);
  const how=p.type==='of'?`<div class="r ok">Офис автошколы${p.note?' · '+esc(p.note.split('\n').slice(1).join(' ')):''}</div>`
    :p.type==='mo'?`<div class="r ok">Мотоплощадка · ${p.sub==='moto_indoor'?'в помещении':'на улице'}</div>`
    :`<div class="kpp">${kppTags(p,true)}</div><div class="r ok">${p.raw.m===0?'Занятия по адресу рядом со станцией':'Инструктор встречает у станции'}</div>`;
  box.innerHTML=`<b>${esc(p.name)}</b><div class="r">${p.lines.map(l=>`${dots([l])}${esc(short(l))}`).join(' · ')}</div>`+how+
    (ads.length?`<div class="r">Площадки рядом: ${ads.slice(0,2).map(a=>esc(a.p.n)+', '+a.t+' мин').join('; ')}</div>`:'')+
    `<div class="more"><button type="button" data-open="${id}">Подробнее</button></div>`;
  box.querySelector('[data-open]').onclick=()=>select(id,false);
  placeCard();requestAnimationFrame(()=>box.classList.add('on'));
}
function placeCard(){
  const box=$('#sc-card');if(!sc.target||!sm)return;
  const s=stOf(BY_ID[sc.target]);if(!s)return;
  const pt=sm.latLngToContainerPoint(toLL(s.x,s.y)),r=$('#scheme').getBoundingClientRect();
  const w=box.offsetWidth,h=box.offsetHeight;
  const gap=ringSize().r+12;
  const TOP=60,RIGHT=r.width<600?64:12;let left=Math.min(Math.max(pt.x-30,12),r.width-w-RIGHT),top=pt.y+gap,below=false;
  if(top+h>r.height-12&&pt.y-h-gap>=TOP){top=pt.y-h-gap;below=true}
  if(top+h>r.height-12)top=Math.max(TOP,r.height-h-12);
  box.classList.toggle('below',below);box.style.left=left+'px';box.style.top=top+'px';box.style.setProperty('--ax',Math.min(Math.max(pt.x-left-6,14),w-26)+'px');
}
function schemeSelect(p,fly){
  if(!sc.ready)return;
  if(!p){sc.pinned=null;setTarget(null,true);return}
  if(p.type==='ad'){ /* address: centre on its nearest station */
    const n=p.raw.nb[0],s=n&&SC.st.find(x=>x.id===n.s);sc.pinned=null;setTarget(null,true);
    if(fly&&s)sm.setView(toLL(s.x,s.y),Math.max(sm.getZoom(),-.5),{animate:true});
    if(n&&SM_MARK[n.s]){sc.pinned=n.s;setTarget(n.s,true)}return}
  const id=p.id;if(!SM_MARK[id])return;
  sc.pinned=id;setTarget(id,true);
  if(fly)reveal(sm,smCluster,SM_MARK[id],-.5,placeCard);
}
function highlight(p,fly){highlightCity(p,fly)}

/* ---------- view switching ---------- */
let view='scheme';
function setView(v){
  view=v;$('#app').classList.toggle('is-scheme',v==='scheme');$('#app').classList.toggle('is-map',v==='map');
  $('#v-scheme').setAttribute('aria-selected',v==='scheme');$('#v-map').setAttribute('aria-selected',v==='map');
  $('#scheme').hidden=v!=='scheme';$('#sc-zoom').hidden=v!=='scheme';$('#map').style.visibility=v==='map'?'visible':'hidden';
  if(v!=='scheme')cardOff();
  if(v==='scheme'){if(sm){sm.invalidateSize();if(sc.target)renderCard()}else loadScheme()}
  if(v==='map'){if(cityMap){cityMap.invalidateSize();highlightCity(state.sel&&BY_ID[state.sel],true)}else initCity()}
}
$('#v-scheme').onclick=()=>setView('scheme');$('#v-map').onclick=()=>setView('map');

/* ---------- controls ---------- */
const nst=PLACES.filter(p=>p.type==='st').length,nad=PLACES.filter(p=>p.type==='ad').length;

$('#stats').innerHTML=`<div class="stat"><b>${PLACES.length}</b><span>мест встречи</span></div><div class="stat"><b>${nst}</b><span>у метро и МЦД</span></div><div class="stat"><b>${nad}</b><span>по адресу</span></div>`;
$('#foot').textContent=`Данные обновлены ${D.date}. Карта © OpenStreetMap, OpenFreeMap.`;
let t;$('#q').oninput=e=>{state.q=e.target.value;$('#searchbox').classList.toggle('has-value',!!state.q);clearTimeout(t);t=setTimeout(()=>{if(state.sel)select(null);renderList()},120)};
$('#clear').onclick=()=>{$('#q').value='';$('#q').dispatchEvent(new Event('input'));$('#q').focus()};
$$('.seg [data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;$$('.seg [data-type]').forEach(x=>x.setAttribute('aria-pressed',x===b));select(null);renderList()});
$$('[data-kpp]').forEach(b=>b.onclick=()=>{state.kpp=b.dataset.kpp;$$('[data-kpp]').forEach(x=>x.setAttribute('aria-pressed',x===b));if(state.kpp!=='any'&&(state.type==='ad'||state.type==='svc')){state.type='all';$$('.seg [data-type]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.type==='all'))}select(null);renderList()});
$('#mcd').onchange=e=>{state.mcd=e.target.checked;select(null);renderList()};
$('#toggle-lines').onclick=e=>{state.lines=!state.lines;e.currentTarget.setAttribute('aria-pressed',state.lines);if(cityMap){state.lines?cityLines.addTo(cityMap):cityLines.remove()}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sel)select(null)});

renderList();
setView(new URLSearchParams(location.search).get('view')==='map'?'map':'scheme');
});
</script>
